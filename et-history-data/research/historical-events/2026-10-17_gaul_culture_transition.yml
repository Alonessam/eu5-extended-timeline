schema_version: 1
period_id: ancient
collected_on: "2026-10-17"
records:
  gaul_58ce_population_baseline:
    entity: culture_gallian
    subject: population_baseline_58ce
    finding: >-
      At the 58 CE start the population of Gaul (modern France, Belgium, and the
      Rhineland) is overwhelmingly recorded as gallian (~1,000 pop blocks),
      practicing gallo_roman_polytheism. Aquitanian pops in the southwest speak basque_language,
      Belgae in the north are recorded under continental Celtic traditions, and Roman
      administrative, military, and merchant minorities exist in colonies such as
      Lugdunum, Narbo Martius, Nemausus, and Massilia. This baseline is the anchor
      for all western European romance transitions.
    population: "Gallic rural and tribal majority; small Roman colonial presence"
    dating: {precision: year, date: "58", calendar: ce_year_normalized_to_et}
    mechanism: start setup data (no transition claimed)
    source_refs: [{id: caesar_de_bello_gallico, locator: "Book 1, Section 1 (Gallia est omnis divisa in partes tres)"}]
    confidence: high
    integration: {status: applied, target: "Extended Timeline/main_menu/setup/start/06_pops.txt", note: "58.2.1 start blocks"}

  gaul_concilium_galliarum_claudian_integration:
    entity: culture_gallian
    subject: elite_romanization_and_gallo_roman_emergence
    finding: >-
      Following the Speech of Claudius (48 CE, Tabula Claudiana), Gallic chieftains
      (initially Haedui, later across Gallia Comata) receive senatorial rights and Roman
      citizenship. The annual Concilium Galliarum at the Altar of Rome and Augustus in
      Lugdunum (Lyon) anchors the Gallic aristocracy into the imperial political structure.
      Urban elites adopt Latin, Roman civic administration, and the toga, creating the
      first tier of gallo_roman identity.
    population: "Gallic aristocracy, tribal chieftains, urban burghers, and administrative centers"
    dating: {precision: period, date: "c. 48-100", calendar: ce_year_normalized_to_et}
    mechanism: senatorial integration, municipal urbanization, elite Latinization
    source_refs: [{id: tacitus_annales_claudius, locator: "Tacitus, Annales 11.23-25; CIL XIII 1668"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.101)", note: "Urban gallian nobles, clergy and burghers become gallo_roman for ROM c. 58-100 CE."}

  gaul_interpretatio_romana_and_syncretism:
    entity: culture_gallian
    subject: religious_and_cultural_syncretism
    finding: >-
      Gallo-Roman religion synthesizes indigenous Celtic deities with Roman counterparts
      (Interpretatio Romana): Lugus and Mercury, Toutatis and Mars, Apollo Grannus,
      Sulis-Minerva, and Epona. Rural villas, road networks, and Romano-Celtic temples
      (fana) proliferate, spreading Vulgar Latin and Gallo-Roman material culture
      beyond urban centers into the agrarian countryside.
    population: "Provincial artisan, peasant, and agrarian populations across Gallia"
    dating: {precision: period, date: "c. 100-200", calendar: ce_year_normalized_to_et}
    mechanism: syncretic religious practice, villa economy, road infrastructure
    source_refs: [{id: caesar_de_bello_gallico, locator: "Book 6 (Deities of the Gauls)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.102)", note: "Rural gallian laborers and peasants become gallo_roman for ROM c. 100-180 CE."}

  gaul_constitutio_antoniniana_212:
    entity: culture_gallian
    subject: universal_citizenship_and_legal_integration
    finding: >-
      In 212 CE, Emperor Caracalla issues the Constitutio Antoniniana (Edict of Caracalla),
      granting full Roman citizenship to all free men throughout the Roman Empire,
      including all provincial Gauls. This eliminates the legal distinction between Gallic
      provincials and Roman citizens, solidifying legalism and completing the institutional
      transition of Gallic populations into the gallo_roman cultural sphere.
    population: "All free provincial inhabitants of Gallia"
    dating: {precision: year, date: "212", calendar: ce_year_normalized_to_et}
    mechanism: imperial edict, universal legal franchise
    source_refs: [{id: caracalla_constitutio_antoniniana, locator: "P.Giss. 40, col. I; Cassius Dio 78.9"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.104)", note: "All remaining gallian pops become gallo_roman for ROM c. 212-230 CE."}

  gaul_gallic_empire_260_274:
    entity: culture_gallian
    subject: third_century_secession_and_gallic_identity
    finding: >-
      Postumus, a Batavian officer of the Rhine army, is proclaimed emperor in 260
      after defeating the Franks and Alamanni; the Imperium Galliarum controls Gaul,
      Britain and briefly Hispania for fourteen years, with Trier and Cologne as its
      core. The usurpation is a frontier-army secession, not a national revolt; its
      coinage, senate and consuls imitate Rome. Aurelian reabsorbs the empire in 274.
    population: "Rhine legions, Gallic urban elites and the provincial aristocracy"
    dating: {precision: period, date: "260-274", calendar: ce_year_normalized_to_et}
    mechanism: military usurpation, frontier-army autonomy, negotiated reabsorption
    source_refs: [{id: wiki_gallic_empire, locator: "Lead; History (Postumus 260; Aurelian 274)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.105)", note: "ROM 260-274; the nobles, clergy and burghers of the nine city locations become gallo_roman. The window follows the empire's lifespan, so the conversion completes before the Roman restoration."}

  gaul_christianization_martin_tours:
    entity: culture_gallo_roman
    subject: pop_religion_christianization
    finding: >-
      Early urban Christian communities (Lyon martyrs, 177 CE; St. Denis of Paris, c. 250 CE)
      are expanded to rural peasantry in the late 4th century by Saint Martin of Tours
      (316-397 CE). Martin methodically dismantles rural Celtic shrines and sacred groves,
      establishing parish churches and monastic foundations that absorb the last pagan pops.
    population: "Rural and urban Gallo-Roman populations"
    dating: {precision: period, date: "c. 250-450", calendar: ce_year_normalized_to_et}
    mechanism: monastic evangelism, destruction of rural pagan shrines, episcopal parish system
    source_refs: [{id: wiki_martin_of_tours, locator: "Life (rural Christianization in Gaul)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.103, et_culture.106)", note: "ROM: .103 (177-350) turns the nobles, clergy and burghers of the nine city locations catholic and .106 (371-400) their laborers and peasants. Rural Gaul is left alone. The Latin Nicene faith is modeled with the catholic key throughout; the earlier chalcedonism key was dropped in the 2026-10-18 review as anachronistic for these dates (Chalcedon = 451)."}

  gaul_armorica_breton_migration:
    entity: culture_gallo_roman
    subject: insular_celtic_migration_and_breton_genesis
    finding: >-
      Between the late 4th and 6th centuries, Brittonic-speaking Celts from southwestern
      Britain flee Anglo-Saxon invasions and settle heavily in the Armorican peninsula.
      They assimilate the sparse Gallo-Roman population, re-establishing a living Celtic
      tongue (Breton, Breizh) in northwestern Gaul.
    population: "Armorican peninsula population"
    dating: {precision: period, date: "c. 380-550", calendar: ce_year_normalized_to_et}
    mechanism: trans-marine migration, language replacement
    source_refs: [{id: wiki_brittany, locator: "History - Breton settlement; the Gallo/Breton linguistic line"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.107)", note: "ROM 380-550, the record's dating; the ROM tag plus the brest gate fires it while Rome still holds the peninsula. The gallian and gallo_roman pops of brest and saint_malo become breton. Western Armorica only: Rennes and Nantes stay Gallo-Romance and join the northern French list in .111 (2026-10-18 fix)."}

  gaul_rhine_crossing_and_germanic_settlement_406_443:
    entity: culture_gallo_roman
    subject: germanic_migration_and_foederati_settlement
    finding: >-
      On the last night of 406 the Rhine frontier gives way before Vandals, Alans
      and Suebi; the migration passes through Gaul (406-409) toward Iberia and the
      Mediterranean, while foederati settlements follow: Visigoths in Aquitaine
      around Toulouse and Bordeaux (418), Burgundians in Sapaudia around Geneva and
      up the Rhone to Lyon (443) after the defeat of 436-437. The event models Arian
      migrant communities in these locations.
    population: "Arian Germanic foederati and migrant groups in the Gallic provinces"
    dating: {precision: period, date: "406-443", calendar: ce_year_normalized_to_et}
    mechanism: frontier collapse, migration, foederati (hospitalitas) settlement
    source_refs: [{id: wiki_crossing_of_the_rhine, locator: "Lead; Invasion (31 December 406)"}, {id: wiki_visigothic_kingdom, locator: "Aquitaine settlement 418"}, {id: wiki_kingdom_of_the_burgundians, locator: "Sapaudia 443"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.108)", note: "ROM 406-443; adds arian burgundian pops at geneve and lyon and arian visigoth ones at toulouse and bordeaux, on owned locations only. No Vandal pops: the Vandals only passed through Gaul toward Hispania and Africa (UPDATE 10 audit)."}

  gaul_fall_of_soissons_486:
    entity: culture_gallo_roman
    subject: end_of_roman_rule_in_northern_gaul
    finding: >-
      The Domain of Soissons, the last Roman authority in northern Gaul held by
      Syagrius, falls to Clovis at the Battle of Soissons (486); Syagrius flees to
      the Visigoths and is later handed over and executed. The conquest of the Seine
      basin opens the Frankish phase; the event turns the northern Gallo-Roman city
      populations toward the Frankish identity.
    population: "Gallo-Roman towns of the Seine basin (Soissons, Paris, Reims, Rouen)"
    dating: {precision: period, date: "457-486", calendar: ce_year_normalized_to_et}
    mechanism: military conquest, absorption of the Roman rump state
    source_refs: [{id: wiki_battle_of_soissons_486, locator: "Lead; Background (Syagrius; Domain of Soissons)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.109)", note: "ROM 457-486; a quarter of the gallo_roman pops at soissons, paris, reims and rouen becomes frankish (split_pop 0.25), modeling the small Frankish warrior elite rather than a population replacement. The last event of the ROM layer; the city list is ownership-guarded."}

  gaul_clovis_conversion_and_franco_roman_synthesis:
    entity: culture_gallo_roman
    subject: germanic_superstrate_and_frankish_synthesis
    finding: >-
      Following the Battle of Soissons (486 CE) and the defeat of the last Gallo-Roman ruler
      Syagrius, King Clovis I converts to Chalcedonian Catholicism (c. 496/508 CE) at Reims.
      The Frankish warrior elite integrates with the Gallo-Roman senatorial and episcopal
      aristocracy; Frankish phonetic and vocabulary influences merge into Vulgar Latin,
      forming the roots of Old French.
    population: "Northern Gaulish populations and Frankish warrior settlers"
    dating: {precision: period, date: "c. 486-530", calendar: ce_year_normalized_to_et}
    mechanism: conquest, dynastic baptism, elite intermarriage, bilingual linguistic contact
    source_refs: [{id: wiki_baptism_of_clovis, locator: "Lead; Date (496 or 508); Reims, Bishop Remigius"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.110)", note: "FRAN 496-508; the gallo_roman and frankish pops of soissons, paris, reims, rouen and orleans become catholic. First event of the Frankish layer; the DHE was rebound from ROM to FRAN in the 2026-10-18 review."}

  gaul_oil_oc_dialect_divergence:
    entity: culture_gallo_roman
    subject: regional_romance_differentiation
    finding: >-
      During the Carolingian period, Gallo-Roman speech splits definitively into Langue
      d'oïl in the north (heavy Frankish superstrate, evolved into French, Picard, Walloon),
      Langue d'oc in the south (Mediterranean Latin continuity, evolved into Occitan, Gascon,
      Provençal), and Arpitan in the Alpine/Rhône corridor. The Council of Tours (813 CE)
      and Oaths of Strasbourg (842 CE) mark the official recognition of Old French.
    population: "All Romance-speaking populations across the former Gaul"
    dating: {precision: period, date: "c. 650-850", calendar: ce_year_normalized_to_et}
    mechanism: phonetic divergence, substrate/superstrate differentiation, administrative vernacularization
    source_refs: [{id: wiki_council_of_tours, locator: "Canon 17 (rusticam romanam linguam)"}, {id: wiki_oaths_of_strasbourg, locator: "Text (earliest Romance attestation)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.111, et_culture.112)", note: "FRAN 650-850; .111 splits the city gallo_roman into french, occitan and arpitan by region, and .112 (813-842) changes the language of the remaining gallo_roman to french_language (trigger requires tours; effect runs on every owned location after the UPDATE 14 syntax fix). FRAN-bound after the 2026-10-18 tag rebind; the city list carries the shift, the rest follows normal assimilation."}

  gaul_norman_genesis_911:
    entity: culture_french
    subject: scandinavian_settlement_and_norman_genesis
    finding: >-
      By the Treaty of Saint-Clair-sur-Epte (911 CE), King Charles the Simple grants the
      lower Seine valley to Viking leader Rollo. The Norse settlers rapidly adopt the local
      Old French language and Catholic religion within two generations, creating the distinct
      norman culture.
    population: "Lower Seine / Normandy populations and Scandinavian settlers"
    dating: {precision: year, date: "911", calendar: ce_year_normalized_to_et}
    mechanism: feudal cession, conversion, rapid linguistic assimilation
    source_refs: [{id: wiki_treaty_of_saint_clair_sur_epte, locator: "Terms (Rollo; conversion to Christianity)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.113)", note: "FRAN 911; adds catholic norman pops at rouen only, the treaty's lower-Seine grant. The Cotentin (Cherbourg), the Bessin (Bayeux) and Caen were Normanized later, so they are out of the 911 window (2026-10-18 review). FRAN-bound; the trigger requires rouen."}

  gaul_albigensian_crusade_1209_1229:
    entity: culture_occitan
    subject: albigensian_crusade_and_the_annexation_of_languedoc
    finding: >-
      Pope Innocent III launches the Albigensian Crusade (1209-1229) against the
      Cathars of Languedoc; the northern French coalition and the Capetian crown
      break the autonomy of the southern lords (Béziers, Carcassonne, Toulouse) and
      annex the county of Toulouse by 1229. The region keeps its Occitan speech, but
      its political elite and urban culture are realigned with the French crown.
    population: "Occitan-speaking population and nobility of Languedoc"
    dating: {precision: period, date: "1209-1229", calendar: ce_year_normalized_to_et}
    mechanism: religious crusade, conquest, annexation (Treaty of Paris 1229)
    source_refs: [{id: wiki_albigensian_crusade, locator: "Lead; Aftermath (Treaty of Paris 1229)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.114)", note: "FRA 1209-1229; thirty percent of the occitan pops of toulouse, nimes, arles and marseille becomes french (split_pop 0.30). The first event of the France layer; bordeaux was removed by the UPDATE 14 audit since Gascony was under English rule in this window."}

  gaul_hundred_years_war_1337_1453:
    entity: culture_french
    subject: hundred_years_war_and_french_identity
    finding: >-
      The intermittent Anglo-French conflict (1337-1453) over the succession and the
      English possessions runs from Crécy and Agincourt to the relief of Orléans
      (Joan of Arc, 1429) and Castillon (1453). The war strengthens the Valois
      state, a standing army and a proto-national identity; English claims except
      Calais end, and French spreads in administration.
    population: "The kingdom's elites, soldiery and taxpayers on both sides of the Channel"
    dating: {precision: period, date: "1337-1453", calendar: ce_year_normalized_to_et}
    mechanism: dynastic war, fiscal-military state building, identity consolidation
    source_refs: [{id: wiki_hundred_years_war, locator: "Lead; Overview (1337-1453)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.115)", note: "FRA 1337-1453; the norman, arpitan and frankish pops of paris, reims, rouen, caen, orleans, tours and soissons become french. FRA-bound historical layer."}

  gaul_villers_cotterets_edict_1539:
    entity: culture_french
    subject: vernacularization_of_law_and_the_rise_of_french
    finding: >-
      The ordinance of Villers-Cotterêts (August 1539, registered 6 September)
      requires judicial acts and notarial records to be drawn up in the French
      mother tongue rather than Latin. It is a milestone of judicial
      vernacularization, but the later claim that it made French the official
      language of France is retrospective: its scope is judicial and notarial, and
      linguistic unification follows much later (1789-1914).
    population: "Legal and notarial professionals; vernacular speakers of the realm"
    dating: {precision: period, date: "1539", calendar: ce_year_normalized_to_et}
    mechanism: royal ordinance, judicial vernacularization
    source_refs: [{id: wiki_ordinance_of_villers_cotterets, locator: "Articles 110-111; registered 6 September 1539"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.116)", note: "FRA 1539-1540; the gallo_roman, occitan, arpitan and norman pops change their language to french_language (trigger requires paris; effect runs on every owned location after the UPDATE 14 syntax fix)."}

  gaul_wars_of_religion_and_edict_of_nantes_1562_1685:
    entity: culture_french
    subject: confessional_wars_toleration_and_revocation
    finding: >-
      Eight civil wars (1562-1598) between Catholics and Huguenots culminate in
      Henry IV's Edict of Nantes (1598), granting limited toleration and safe
      places; the event's city list models the conflict's urban geography.
      Toleration erodes under Louis XIII and Louis XIV and ends with the Edict of
      Fontainebleau (1685), revoking Nantes and driving the Huguenot emigration.
    population: "Urban populations of Paris, Rouen, Orléans, Tours, Nantes and Bordeaux"
    dating: {precision: period, date: "1562-1685", calendar: ce_year_normalized_to_et}
    mechanism: confessional civil war, edicts of toleration and revocation, emigration
    source_refs: [{id: wiki_edict_of_nantes, locator: "Terms; Revocation (1685)"}, {id: wiki_edict_of_fontainebleau, locator: "Revocation of the Edict of Nantes"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.117)", note: "FRA 1562-1685; the calvinist pops of paris, rouen, orleans, tours, nantes, bordeaux and toulouse return to catholic on owned locations. The window and the label span the first civil war to the revocation of Nantes."}

  gaul_revolution_gregoire_1789_1794:
    entity: culture_french
    subject: revolutionary_linguistic_unification
    finding: >-
      The Revolution ties citizenship to the French language; Abbé Grégoire's
      report of 16 prairial an II (4 June 1794) calls for abolishing the patois
      and universalizing French, estimating that millions still spoke only
      regional languages. The event models the shift of the southern and
      peripheral populations toward French as the language of the Republic.
    population: "Occitan, Arpitan and Norman speakers; the new citizenry of the Republic"
    dating: {precision: period, date: "1789-1794", calendar: ce_year_normalized_to_et}
    mechanism: revolutionary centralization, language policy, schooling
    source_refs: [{id: wiki_gregoire_report, locator: "Séance du 16 prairial an II (4 June 1794); report text"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.118)", note: "FRA 1789-1794; half of the occitan, arpitan, norman and frankish pops of the thirteen city locations becomes french (split_pop 0.50). The Grégoire report is the record's anchor."}

  gaul_jules_ferry_modern_unification_1881:
    entity: culture_french
    subject: modern_national_linguistic_homogenization
    finding: >-
      Through the Jules Ferry laws of 1881-1882, the French Third Republic establishes free,
      mandatory, and laic public primary education. Article 1 of the 1882 law makes "the
      language and elements of French literature" a core subject, and provision expands
      fastest in the least francophone regions (schooling in western Brittany grew by
      nearly 200 percent between 1837 and 1906). Schooling, the railway, conscription and
      the market together turn the regional peasant populations into standard French
      speakers over the following two generations.
    population: "All regional and provincial populations of France; Breton, Occitan, Arpitan and Norman speakers last"
    dating: {precision: period, date: "1881-1882", calendar: ce_year_normalized_to_et}
    mechanism: universal compulsory primary education, linguistic centralism, market and conscription integration
    source_refs: [{id: weber_peasants_into_frenchmen, locator: "Chapters 6, 18, 29"}, {id: wiki_jules_ferry_laws, locator: "Laws of 1882, Article 1; History"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.119)", note: "Partial shift - half of the remaining Breton-speaking population per firing; the war completes it."}

  gaul_laicite_separation_1905:
    entity: culture_french
    subject: church_state_separation_and_secularization
    finding: >-
      The law of 9 December 1905 separates the churches from the state: the Republic no
      longer recognises, funds or subsidises any religion, and church buildings become
      public property. Laïcité becomes a founding principle of the French state, though the
      measure is divisive at the time (Pope Pius X condemns it in the 1906-1907
      encyclicals, and reconciliation comes only in the 1920s). This is a state and
      political-faith marker rather than a mass change of pop religion.
    population: "French state and institutions; practising Catholic population most affected"
    dating: {precision: year, date: "1905", calendar: ce_year_normalized_to_et}
    mechanism: legislative separation of church and state (laïcité)
    source_refs: [{id: wiki_separation_church_state_1905, locator: "Article intro; History; Effects; Reactions by the Catholic Church"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.120)", note: "Modeled as a state policy choice; no direct pop religion conversion (no secular religion key exists)."}

  gaul_great_war_union_sacree_1914_1918:
    entity: culture_french
    subject: national_identity_fusion_under_total_war
    finding: >-
      On 4 August 1914 President Raymond Poincare calls for a sacred union (union sacree)
      of all Frenchmen against the German attack, and the left suspends its opposition and
      strike pledges for the duration of the war. Men from every province serve side by
      side in the trenches, completing the linguistic and national integration that the
      republican school had begun; regional particularism fades further in the interwar
      years.
    population: "All French regions; the Breton-speaking interior last"
    dating: {precision: period, date: "1914-1918", calendar: ce_year_normalized_to_et}
    mechanism: mass mobilization, shared military service, wartime political truce
    source_refs: [{id: wiki_sacred_union, locator: "Article intro; Poincare address of 4 August 1914"}, {id: weber_peasants_into_frenchmen, locator: "Chapters 18, 29"}]
    confidence: medium
    integration: {status: applied, target: "events (et_culture.121)", note: "Completes the Breton-to-French shift left open by the school event."}

  gaul_language_of_the_republic_1992_2008:
    entity: culture_french
    subject: regional_language_recognition_and_jacobin_principle
    finding: >-
      The Fifth Republic fixes in article 2 of the constitution that the language of the
      Republic is French (1992). The 1999 Cerquiglini report identifies 75 languages
      eligible for recognition under the European Charter for Regional or Minority
      Languages, but the Constitutional Council blocks ratification; the 2008 revision adds
      only that regional languages belong to the patrimony of France (art. 75-1). Regional
      languages (Breton, Occitan, Alsatian, Basque, Corsican) survive as minority and
      patrimonial speech, not as everyday majorities.
    population: "Regional-language speakers; a shrinking share of the national population"
    dating: {precision: period, date: "1992-2008", calendar: ce_year_normalized_to_et}
    mechanism: constitutional entrenchment of French, limited recognition of regional languages
    source_refs: [{id: wiki_languages_of_france, locator: "Status (constitution art. 2; 1999 report; 2008 art. 75-1); Statistics (INSEE 1999)"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.123)", note: "Slow late window; a policy choice rather than a pop change."}

  gaul_postwar_labour_immigration_1945_1975:
    entity: culture_french
    subject: postwar_labour_immigration_and_settlement
    finding: >-
      Postwar reconstruction and the Trente Glorieuses (1945-1975) drew millions of
      foreign workers into France through the National Immigration Office. Portuguese
      peasants fleeing the Salazar dictatorship and colonial conscription became the
      largest foreign community, their emigration peaking at 135,667 arrivals in 1970;
      Algerians moved freely before independence in 1962, after which their community in
      France grew from about 350,000 to 700,000; Moroccans, Tunisians, Turks and Berbers
      from Kabylia followed in the 1960s, alongside Italians and Spaniards. Immigrants
      concentrated in the Paris region, Lyon and Marseille and filled about two-thirds of
      the jobs in mining, steel, construction and the automotive industry. After the 1974
      oil shock new entry was restricted, but family reunification settled these
      communities permanently.
    population: "Foreign labour migrants and their descendants in the French industrial cities"
    dating: {precision: period, date: "1945-1975", calendar: ce_year_normalized_to_et}
    mechanism: state labour recruitment, economic migration, chain migration and family settlement
    source_refs: [{id: wiki_immigration_to_france, locator: "History (1945-1974; 1974-present); Maghrebis; By country of origin"}, {id: wiki_portuguese_in_france, locator: "History (Great Portuguese emigration 1957-1974); Demographics"}]
    confidence: high
    integration: {status: applied, target: "events (et_culture.122)", note: "Modeled as add_pop of Portuguese, Algerian, Moroccan, Kabyle and Turkish labourers plus Piedmontese and Neapolitan (Italian) and Castilian (Spanish) ones; EU5 1.3.x has no umbrella italian or spanish culture key, so the regional cultures stand in for those migrant streams. The historical option also carries a small stability cost, since mass immigration was socially divisive."}
