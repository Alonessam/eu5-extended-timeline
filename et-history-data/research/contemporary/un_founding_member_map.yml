  - id: un_founders
    locator: "Founding Member States table (Date of Signing and Deposit of Ratification columns)"

notes: >-
  Signature, ratification and membership-effective are three different events.
  The Charter was signed on 26 June 1945 by 50 states and on 15 October 1945
  by Poland, so 51 states signed. Membership becomes effective on the date the
  instrument of ratification was deposited, and the Charter entered into
  force on 24 October 1945. Twenty-nine of the 51 founding members had
  ratified by 24 October 1945 (including the five permanent members and
  Poland); the remaining 22 deposited their instruments between 25 October and
  27 December 1945. A membership snapshot dated 24 October 1945 therefore
  contains 29 states, not 51. The tags are the repository's own country tags
  (et-history-data/countries/); where a state has more than one tag in the
  corpus, the modern one is used and the historical one is named in the note.

