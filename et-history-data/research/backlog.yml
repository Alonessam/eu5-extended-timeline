schema_version: 1
updated_on: "2026-10-18"
tasks:
  roman_succession_dates:
    period_id: ancient
    priority: 1
    state: pending
    targets: [characters/ROM.yml, countries/ROM - Rome.yml]
    source_refs: [suetonius_augustus, suetonius_tiberius]
    question: Distinguish the ruler's death from de facto succession and formal recognition.
    evidence: >-
      Augustus death is sourced to 14.8.19 while the existing character and
      country transition use 14.9.18. Tiberius death is sourced to 37.3.16
      while the existing character and country transition use 37.3.18.
    acceptance: Apply linked timelines together with explicit dating and modeling notes; do not leave a dead ruler selected accidentally.
  antium_location_mapping:
    period_id: ancient
    priority: 1
    state: pending
    targets: [characters/ROM.yml, locations]
    source_refs: [suetonius_caligula, suetonius_nero]
    question: Which existing EU5 location covers Antium, and how precise is that mapping?
    acceptance: Record the historical place and verified location ID before replacing the old Rome birthplace approximation.
  roman_duplicate_ids:
    period_id: ancient
    priority: 2
    state: pending
    targets: [characters/ROM.yml, countries/ROM - Rome.yml]
    source_refs: [suetonius_caligula, suetonius_claudius]
    question: Can duplicate Caligula and Claudius IDs be reconciled without breaking historical references?
    acceptance: Audit every reference first; retain stable IDs or publish a complete alias/migration list.
  armenia_war_and_succession:
    period_id: ancient
    priority: 1
    state: pending
    targets: [wars/firstromanparthianwar.txt, countries/ARM - Armenia.yml]
    source_refs: [iranica_armenia, iranica_vologases]
    question: Which dates and war phases are supported for Corbulo's campaign and Tigranes' appointment?
    evidence: >-
      The source places the campaign in spring 58 and Tigranocerta's surrender
      in spring 59. Existing data uses 58.2.1 for the war and 58.7.1 for the
      ruler change. These exact days have not been verified. Tigranes numbering
      differs between scholarly accounts.
    acceptance: Preserve year/season uncertainty and avoid forcing a precise game day without a documented conversion policy.
  abbassid_capital_mapping:
    period_id: medieval
    priority: 2
    state: pending
    targets: [countries/ABBA - Abbasid.yml, locations]
    source_refs: [met_abbasid]
    question: Are the Baghdad and Samarra capital changes already present, and which location IDs represent them?
    evidence: >-
      The 58 CE cities batch marks the Baghdad tile with the Seleucia-Ctesiphon
      reading at 58.2.1; a dated 762 change for Baghdad itself is still to be modeled.
    acceptance: Verify existing timeline keys and mapping before adding year-level events; Baghdad foundation does not erase earlier settlements in its location.
  eic_full_archive_review:
    period_id: early_modern
    priority: 2
    state: pending
    targets: [research/early_modern/2026-10-13_eic.yml]
    source_refs: [bl_eic]
    question: Obtain the full IOR/B catalogue and charter text beyond the indexed excerpt.
    acceptance: Verify charter scope and organizational representation; do not convert incorporation into territorial ownership.
  railway_route_mapping:
    period_id: industrial
    priority: 2
    state: pending
    targets: [locations]
    source_refs: [nrm_stockton_darlington, smg_rocket]
    question: How should dated routes, railway infrastructure and locomotive evidence be represented?
    acceptance: Map the actual route to existing location IDs and distinguish an opening event from nationwide adoption.
  un_membership_mapping:
    period_id: contemporary
    priority: 2
    state: pending
    targets: [international_organizations]
    source_refs: [un_founders]
    question: Map all 51 founding states and their effective dates to repository tags.
    acceptance: Separate signature and ratification; do not assign every founding state membership on 24 October 1945.
  geographic_coverage:
    period_id: ancient
    priority: 1
    state: pending
    targets: [countries, characters, locations]
    source_refs: [met_han, wiki_han_economy, wiki_urban_sizes, periplus_schoff]
    question: Extend the 58 CE batch to South Asia, Africa and the Americas, and obtain stronger Eastern Han ruler sources.
    evidence: >-
      Batch "2026-10-17 58ce cities and markets" added city rank and market
      flags for 74 locations across Europe, Asia, Africa and Mesoamerica
      (economy layer, batch 1). Eastern Han ruler sources are still pending.
    acceptance: Add scoped sources and explicit uncertainties; this first batch does not establish global coverage.
  han_capital_tile_mapping:
    period_id: ancient
    priority: 1
    state: completed
    targets: [locations, "Extended Timeline/main_menu/setup/start/07_cities_and_buildings.txt", "Extended Timeline/main_menu/setup/start/14_development.txt", "Extended Timeline/main_menu/setup/start/03_markets.txt"]
    question: Which tile is the Han capital, and where should the 07 megalopolis rank and 14 development entry sit?
    evidence: >-
      The changan key resolves to a Rongzhou (Guangxi) village with Zhuang/Yao tribesmen
      pops; it was removed in c12bc57 and the rank moved to xianyang. The jingzhao tile
      carries the metropolis pop profile from the initial pop setup, Han-era character
      birthplaces and the 03 market; the 58.2.1 data flags were moved there on 2026-10-17.
    resolution: >-
      Confirmed jingzhao as the unified Western Han metropolis tile. 03 market, 07 megalopolis
      rank, and 14 development 12 are all aligned on jingzhao across mod and data workspace.
    acceptance: Maintainer confirms the final tile (jingzhao proposed); 03 market, 07 rank and 14 development end up on the same location.
  ancient_economy_roads_and_town_ranks:
    period_id: ancient
    priority: 2
    state: pending
    targets: [locations]
    source_refs: [periplus_schoff, wiki_urban_sizes]
    question: Which dated roads adjacency and town-level ranks belong to the 58 CE economy layer (batch 2)?
    acceptance: Add only evidence-backed neighbor-name road maps and town ranks; re-read the Location Files doc before editing.
  ancient_city_setup_field:
    period_id: ancient
    priority: 3
    state: pending
    targets: [locations]
    source_refs: []
    question: Which vanilla town_setups values exist, and should the 74 city locations gain a setup field?
    acceptance: Copy setup values only from verified vanilla data; do not invent setup ids.
  ancient_economy_source_upgrades:
    period_id: ancient
    priority: 2
    state: pending
    targets: [research/ancient/2026-10-17_58ce_cities_and_markets.yml, research/sources.yml]
    source_refs: [wiki_corduba, wiki_damascus, wiki_narbonne]
    question: Replace the weak sources flagged in the 58 CE cities batch (Corduba stub, Damascus intro, Narbonne colony status, Peshawar and Dunhuang intros) with stronger references.
    acceptance: Keep findings and confidence levels in sync with any replacement; do not silently drop caveats.
  location_tile_identifications:
    period_id: ancient
    priority: 2
    state: pending
    targets: [locations]
    source_refs: [wiki_urban_sizes, periplus_schoff]
    question: Which tiles cover Rhodes, Paithan, Memphis, Berenice, Istakhr and Yangzhou/Guangling, and how precise are the approximations already noted (Petra, Artaxata, Taxila, Cyrene, Chang'an, Linzi, Dunhuang)?
    acceptance: Verify filename uniqueness and document distances in records; postpone tile renames.
  historical_events_and_culture_transition:
    period_id: ancient
    priority: 1
    state: in_progress
    targets: [research/historical-events/README.md, research/historical-events/2026-10-17_egypt_culture_transition.yml, research/historical-events/2026-10-17_egypt_event_design.md, research/historical-events/2026-10-17_gaul_culture_transition.yml]
    source_refs: [wiki_islamization_egypt, wiki_coptic_language, tacitus_annales_claudius, caracalla_constitutio_antoniniana, caesar_de_bello_gallico]
    question: Which region pilots the historical events and culture transition layer, and are intermediate identities (e.g. gallo_roman) needed between the 58 CE cultures and the modern keys?
    evidence: >-
      The 58 CE start leaves large ancient culture blocs (roman, germanic, slavic,
      gallian, ancient_greek, old_egyptian) while modern identities carry almost no
      pops; the engine only assimilates pops toward the owner's primary culture and
      never splits cultures on its own, so historical differentiation requires a
      script layer. The plan at research/historical-events/README.md records verified
      EU5 1.3.x tools (change_pop_culture, change_pop_religion, form_new_culture,
      merge_culture_group, change_language, add_migration) and phases the work
      data-first; the mod has no events or on_action layer yet. Maintainers confirmed
      Gaul (Galya) as the Phase 1 pilot region with gallo_roman intermediate identity.
      The 2026-10-17 working session selected Mısır (Egypt) as the pilot region and
      collected sourced transition records for the Egyptian chain (old_egyptian ->
      coptic_culture -> lower/upper egyptian, plus kushite -> nubian) in
      historical-events/2026-10-17_egypt_culture_transition.yml; the culture graph gaps
      for old_egyptian, kushite and gallian were fixed in the mod the same day. The
      Mısır pilot needs no new culture keys.
      RESOLVED (2026-10-17): the two decisions run as parallel Phase 1 tracks — Mısır
      (Egypt: records and WS3 fixes collected, design note published in
      historical-events/2026-10-17_egypt_event_design.md; five-event chain planned via
      tag-agnostic yearly on_action pulse) and Gaul (Galya: gallo_roman intermediate identity,
      sourced records collected in historical-events/2026-10-17_gaul_culture_transition.yml,
      gallo_roman defined in mod, and pilot events et_culture.101 to et_culture.103
      implemented with English and Turkish localization). Neither track blocks the other.
      UPDATE (2026-10-17, Egypt track): the Egyptian chain is now implemented in the mod -
      et_culture.1 to et_culture.5 in in_game/events/et_culture_events.txt, fired by
      et_egypt_yearly_pulse in the new file in_game/common/on_action/et_history_pulses.txt
      (vanilla yearly_country_pulse hook; owner-agnostic, one-shot per country via
      variables), with English and Turkish localization; the et_culture.9000 test event
      stays until in-game validation. The numbering agreement is realized: the Gaul pilot
      was renumbered to et_culture.101-103, leaving .1-.49 to Egypt (.100-.149 Gaul).
      TEST A PASSED (2026-10-17): the template event et_culture.9000 and the Gaul event
      et_culture.101 both fired in a live 58 CE start, and the session's error.log holds
      no mod-related line. Test B (chain) uses the verified EU5 console protocol
      (event, test_event_trigger, event_probabilities, change_date, tick_day) instead of
      temporary 58.x windows; protocol recorded in the design note, section 5.
      UPDATE 2 (2026-10-17, Egypt track): Samet's review commit f3d304d aligned the
      chain with the spec (event .2 resistance 0.05->0.15; event .3 window to
      650-1100) and materialized the Egyptian end-state keys inside the mod
      (coptic/lower/upper egyptian cultures in et_egypt.txt; coptic/arabic
      languages in 00_et_african.txt; miaphysite in et_christianity.txt) using the
      mod's established implicit-override pattern (the mod never uses REPLACE:;
      filenames sort after vanilla). Possible content loss in the vanilla-owned
      definitions (arabic dialect block referenced by ~30 vanilla cultures and by
      the mod's own et_muslim islam religion; character name pools; culture
      opinions/goods_demand_modifier; miaphysite autocephaly features) and the .5
      upper-Egypt resistance sync (spec 0.15 vs script 0.25) are flagged as
      maintainer confirmations in the design note, section 7 (items 7-8). Test B
      remains the next step.
      UPDATE 3 (2026-10-17, Egypt track): second review applied the ownership
      decision - vanilla-shadowing copies without a real delta were removed
      (arabic_language, coptic_language, lower/upper egyptian cultures, miaphysite's
      simplified version), restoring the vanilla definitions intact (seven Arabic
      dialects, character name pools, culture opinions/goods_demand_modifier,
      miaphysite autocephaly/canonization/religious_aspects); the two real deltas
      stay as verbatim vanilla plus delta (coptic_culture + arabic_group; miaphysite
      + language = coptic_language); the .5 upper-Egypt resistance returns to the
      spec value 0.15. Invalid gfx tags from the removed blocks dropped with them;
      the remainder stays in invalid_culture_gfx_tags. Test B remains the next step.
      UPDATE 4 (2026-10-17, Gaul-side review): Samet's e271902 (french_group and
      latin_language additions for the Gaul pilot) was reviewed under the same
      ownership rule. The empty latin_language copy in 00_et_celtic.txt would
      shadow the vanilla definition (00_italy.txt: Latin name pools, romance
      family, greek fallback and the roman/church dialects referenced elsewhere)
      and was removed so the vanilla definition loads; the french_group addition
      in et_culture_groups.txt is a harmless duplicate (vanilla's french_group
      body is empty too) and was left in place. The recurring mod-internal
      key-closure pattern now has a dedicated task, vanilla_key_shadow_review.
      UPDATE 5 (2026-10-17, Gaul Phase 2/3 review): Samet's 7992971 and a1988dd
      were reviewed against vanilla data. Confirmed good: dynamic_historical_event,
      has_or_had_tag, fire_only_once, historical_option, owns = location:X,
      location = location:X and pop_type filters are vanilla patterns, all named
      location keys exist in the map data, and the new burgundian/visigoth cultures
      plus central_german_dialect/gothic_language references are valid. The
      et_christianity.txt rebase conflict was resolved by keeping the
      vanilla-verbatim miaphysite block (Egypt review) and dropping the added
      catholicism block. Four defect classes were fixed in the follow-up commit:
      religion:catholicism -> religion:catholic (no such key in vanilla; the custom
      block created a parallel stripped faith without papacy/reform mechanics while
      the design record itself reads "Chalcedonian Catholicism"); location:geneva
      -> location:geneve (the real key; the extra geneva location_templates line
      was dead data and was removed); add_migration (vanilla parameters are
      owner/from/to/amount/months) replaced with add_pop settlement for the three
      migrant peoples (size 2 per location); prestige_major_bonus ->
      prestige_extreme_bonus and -prestige_mild_bonus -> prestige_mild_penalty
      (valid constants, default_values.txt); plus the et_culture.101.desc
      "chieftainers" typo reverted to "chieftains". The Gaul Phase 2/3 design
      records (christianization, Clovis) are still marked pending and the
      Rhine-crossing event has no record yet - record upkeep stays with the Gaul
      track; the new script_token_audit task covers the remaining scripts.
      UPDATE 6 (2026-10-18, Gaul Phase 4/5/6 review): the Gaul Phases 4-6 chain
      (et_culture.111-118; Phases 4 and 5 pushed as 2ca31cc and f980839, Phase 6
      still local) was reviewed line by line against vanilla data and five defect
      classes were fixed. (1) Six invalid prestige negations
      (add_prestige = -prestige_mild_bonus / -prestige_mild_penalty): named
      constants cannot be negated (default_values.txt defines the values and
      vanilla only writes add_prestige = -<number>), so all six became
      add_prestige = prestige_mild_penalty. (2) Events .112 and .116 used
      change_language on pop scope with a language: argument; vanilla
      (000_johan_debug.txt:233, flavor_NAV.txt:216) shows change_language is a
      culture-scope effect taking dialect:<key>, so both now use
      culture:<key> = { change_language = dialect:french_language } and the
      tooltips were aligned. (3) et_french.txt shadowed the vanilla-owned french,
      arpitan and norman cultures (common/cultures/french.txt defines all three)
      with stripped copies that also referenced the non-existent
      arpitan_language / norman_language keys; the three blocks were removed so
      the vanilla definitions load, and only the new occitan key remains.
      (4) occitan carried the undefined southern_european_gfx tag, replaced with
      the vanilla occitan_gfx tag set. (5) Turkish localization grammar/typos
      fixed (.113.a, .115.desc, .116.desc kanziye->kançılaryası, .118.desc,
      .118.historical_info, .112.tt). Residual pre-existing issues found while
      reviewing et_french.txt are left for the audit tasks: the aquitanian
      culture uses the undefined iberian_gfx tag, and the french_* colonial
      cultures use the malformed color = color = rgb {...} (filed under
      invalid_culture_gfx_tags and script_token_audit).
      UPDATE 7 (2026-10-18, Gaul Phase 7/8): the closing Gaul phases
      (et_culture.119-122, Modern & Contemporary France 1837-2026) were added
      data-first: four sourced records (gaul_jules_ferry_modern_unification_1881
      updated to applied; gaul_laicite_separation_1905;
      gaul_great_war_union_sacree_1914_1918;
      gaul_language_of_the_republic_1992_2008) plus four new sources in
      sources.yml (wiki_jules_ferry_laws, wiki_separation_church_state_1905,
      wiki_sacred_union, wiki_languages_of_france), each verified as a live
      en.wikipedia article. The Gaul chain now runs to MS 2026: the Ferry laws
      shift half of the remaining Breton-speaking population to french via
      split_pop.fraction with a culture argument (verified vanilla pattern
      settle_the_frontier.txt:150) as the Republican school spreads; the 1905
      separation of church and state is modeled as a state policy choice (no
      secular religion key exists, so no pop conversion is attempted); the Great
      War completes the breton -> french shift (change_pop_culture); and the
      1992-2008 constitutional language settlement is a late, slow choice.
      English and Turkish localization were added for all four events. The Gaul
      event phases are now documented in the plan README (Faz 4-8), which was
      retitled 58 -> 2026 to match the extended campaign. The single modern
      phase was split at the project's period boundary (docs/Period Classes.md:
      industrial 1800-1945, contemporary 1945+): Faz 7 = Modern France
      1837-1945 (.119-.121) and Faz 8 = Contemporary France 1945-2026 (.122
      plus the postwar immigration layer, filed as gaul_postwar_immigration_layer
      below). Event IDs and localization keys are unchanged; only the phase
      labels moved. Test B remains pending.
      UPDATE 8 (2026-10-18, Gaul Phase 4-7 review of 2ca31cc..9c7d2b3):
      the four new phases were checked line by line against vanilla and the
      game database. Verified: change_language is a culture-scope effect and
      dialect:french_language is a real dialect (common/languages/00_france.txt,
      nested dialect of french_language); split_pop takes fraction + culture
      (events/colonization/settle_the_frontier.txt:150); calvinist, catholic,
      arpitan, norman and all location keys used by the new block exist;
      occitan is a genuinely new culture key (no vanilla shadow) after the
      Phase 4/5 review removed the french/arpitan/norman copies in c6d6bd5;
      all 169 event localization keys are present in both EN and TR; braces
      are 0/0 and the YAML linter exits 0. Fixed in this review: the new
      occitan culture had no name localization (occitan/occitan_ADJ added in
      EN and TR; arpitan/norman already had vanilla keys); event .113 added
      Norman pops to Cherbourg, Bayeux and Rouen without requiring ownership
      of those locations (the trigger now requires all four); Turkish typos in
      .110 (selenek -> geleneksel olarak), .117 (Henry -> Henri), .118
      (partikulyerizm -> bolgesel ayrilikcilik) and .119 (patois'nin,
      Fransizcanin en az konusuldugu bolgeler). Open items: (a) data-first
      gaps - .112 and .114-.118 have no sourced records yet, and five Phase 2/3
      records are still pending/in_progress although their events exist (filed
      as gaul_record_backfill); (b) the whole chain is DHE-bound to the ROM tag
      (.101-.113) and the FRA tag (.114-.122), so an owner of Paris that is
      neither never runs it and no single country spans both halves - the
      Egypt design note rejected DHE for this exact reason (filed as
      gaul_dhe_tag_binding_review); (c) the four Faz 7/8 records are marked
      applied before Test B, so their statuses are provisional until the
      in-game gate. The 01:33 game logs predate these commits (02:28-02:59),
      so Test B must be rerun to cover the new blocks.
      UPDATE 9 (2026-10-18, Gaul Phase 8 fill-in): the gaul_postwar_immigration_layer
      task was completed data-first. Two new sources (wiki_immigration_to_france,
      wiki_portuguese_in_france, both verified live en.wikipedia articles) and one
      record (gaul_postwar_labour_immigration_1945_1975) were added to the research
      layer; the event et_culture.122 "The Trente Glorieuses" (DHE, tag FRA,
      1945-1975, monthly_chance 15) fires from owns = location:paris and adds
      Portuguese, Algerian, Moroccan, Kabyle and Turkish labourers, plus
      Piedmontese, Neapolitan and Castilian for the Italian and Spanish streams
      (EU5 1.3.x has no umbrella italian or spanish culture key), to the industrial
      cities of Paris, Lyon, Marseille, Lille, Bordeaux and Toulouse via
      location-scoped add_pop. To keep the chain in chronological order the former
      .122 (Constitutional language settlement, 1992-2008) was renumbered .123; its
      content is unchanged and only the ID and the en/tr localization keys moved.
      The same review caught two invalid pop_type:craftsmen tokens in .102 and .106
      (vanilla common/pop_types/00_default.txt defines only nobles, clergy,
      burghers, laborers, soldiers, peasants, tribesmen and slaves), both replaced
      with pop_type:laborers; the script_token_audit task remains for the rest of
      the corpus. Test B remains pending.
      UPDATE 10 (2026-10-18, Egypt track Nubia extension): the last unblocked
      data-first step, the Nubia chain, was implemented as et_culture.6
      ("The Silence of Meroe", 300-450; kushite -> nubian, 0.60 historical /
      0.20 resistance in butana_area + nubia_proper_area) and et_culture.7
      ("The Baptism of Nobatia", 536-900; nubian + egyptian_polytheism ->
      miaphysite, 0.60 / 0.35 historical and 0.20 / 0.10 resistance in
      nubia_proper_area / butana_area). The chain runs on the new owner-agnostic
      et_nubia_yearly_pulse (anchors faras, dongola, kerma, shendi, soba) hooked
      into yearly_country_pulse; EN/TR localization added. The Nubian state/royal
      layer (Nobatia's court conversion, Makuria's absorption of Nobatia by 707)
      is deliberately not forced - only pops change - and is filed as
      nubia_state_layer_543_707 below. Kushite pops in Darfur and west of the two
      areas stay outside this v1 scope. Test B now spans .1-.7 (Nubia turn
      separate); records remain pending until it passes.
    acceptance: Maintainers confirm the pilot region and the intermediate-identity policy; phase 1 collects sourced transition records under research/historical-events before any event script is written in the mod.
  nubia_state_layer_543_707:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/events/et_culture_events.txt, research/historical-events/2026-10-17_egypt_culture_transition.yml]
    source_refs: [wiki_nobatia, wiki_meroe]
    question: Should the Nubian extension model Nobatia's royal conversion and Makuria's absorption of Nobatia as state/ownership changes, or remain a population-only layer?
    evidence: >-
      et_culture.7 models the Christianization of Nubian pops in the nubia proper
      and butana areas, but does not change the owner's state religion, create
      Nobatia/Makuria/Alodia tags, or script Makuria's absorption of Nobatia by
      707. At the 58 CE start the MERO tag owns both regions. A state layer needs
      verified tags, ownership transitions and its own source/design pass; forcing
      it through the pop event would conflate ruler change with population change
      (the Egypt design note's quality rules).
    acceptance: Decision recorded; if modeled, state changes are data-first, sourced and tested for owner switches; if not, the population-only abstraction stays explicit in the design note and record integration notes.
  culture_group_gaps_remaining:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/common/cultures/et_balkans.txt, Extended Timeline/in_game/common/cultures/et_persian.txt, Extended Timeline/in_game/common/cultures/et_south_east_asia.txt, Extended Timeline/in_game/common/cultures/et_missing.txt]
    source_refs: []
    question: Which successor culture groups should the remaining groupless mod cultures receive (pannonian, illyrian, tocharian, pyu, pear, and the et_missing fallback set)?
    evidence: >-
      The 2026-10-17 WS3 scan flagged 39 culture records; the Egypt pilot fixed
      old_egyptian and kushite and the plan-flagged gallian link. The remaining
      non-East-Asia entries are triaged in
      research/historical-events/2026-10-17_culture_graph_audit.md; the 26-entry
      East Asia cluster mirrors vanilla groupless isolates and is out of scope.
    acceptance: Assign only groups with a documented successor relation using vanilla group ids; leave intentionally isolate cultures groupless.
  invalid_culture_gfx_tags:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/common/cultures/et_egypt.txt, Extended Timeline/in_game/common/cultures/et_missing.txt, Extended Timeline/in_game/common/cultures/et_french.txt]
    source_refs: []
    question: Which mod culture files use gfx tags that are not defined in the vanilla graphical culture types list?
    evidence: >-
      The 2026-10-17 key scan cross-checked mod culture tags against
      in_game/gfx/graphical_culture_types: middle_eastern_gfx (et_egypt.txt:35,
      et_missing.txt:124/132/148) is not defined; the further candidates
      north_african_gfx (et_missing.txt:132), iranian_gfx (et_missing.txt:148)
      and steppe_gfx (et_missing.txt:156) are absent as well (the arabic_gfx
      usages were removed on 2026-10-17 together with the shadow culture blocks).
      Valid neighbours include middle_east_gfx, arabian_gfx, maghrebi_gfx,
      persian_gfx and egyptian_gfx. The 2026-10-18 Gaul Phase 4/5/6 review fixed
      southern_european_gfx (et_french.txt, occitan -> occitan_gfx) and flagged
      iberian_gfx (et_french.txt:42, aquitanian) as a further undefined tag.
    acceptance: Replace only with tags verified in the vanilla list; keep regional intent reviewed by maintainers; graphics fallback is the expected current effect.
  vanilla_key_shadow_review:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/common]
    source_refs: []
    question: Which additive (et_-prefixed) mod files redefine keys that already exist in vanilla, and does any redefinition drop vanilla content instead of carrying a deliberate, documented delta?
    evidence: >-
      The 2026-10-17 reviews established the delta-vs-shadow rule after two
      incidents: f3d304d materialized empty or simplified copies of vanilla-owned
      keys (arabic/coptic language, lower/upper egyptian culture, miaphysite),
      resolved the same day per the historical_events task, UPDATE 3; e271902
      added an empty latin_language copy in 00_et_celtic.txt, removed the same
      day, plus a harmless empty french_group duplicate (vanilla body is empty
      too). The key_overlap scan lists raw intersections only and is dominated by
      deliberate same-name file replacements (east_asia.txt, british.txt,
      baltic.txt, ...), so the audit must exclude same-named files first and then
      judge each remaining additive redefinition; the pre-existing
      hellenism_religion, alan_paganism, aramaic_language and gothic_language
      redefinitions are believed intentional but are unreviewed under this rule.
    acceptance: Every remaining additive redefinition is kept only as a verbatim vanilla copy plus a documented delta, or removed so the vanilla definition loads; the audit note lists each kept redefinition and its delta.
