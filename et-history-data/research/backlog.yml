schema_version: 1
updated_on: "2026-10-17"
tasks:
  roman_succession_dates:
    period_id: ancient
    priority: 1
    state: pending
    targets: [characters/ROM.yml, countries/ROM - Rome.yml]
    source_refs: [suetonius_augustus, suetonius_tiberius]
    question: Distinguish the ruler's death from de facto succession and formal recognition.
    evidence: >-
      Augustus death is sourced to 14.8.19 while the existing character and
      country transition use 14.9.18. Tiberius death is sourced to 37.3.16
      while the existing character and country transition use 37.3.18.
    acceptance: Apply linked timelines together with explicit dating and modeling notes; do not leave a dead ruler selected accidentally.
  antium_location_mapping:
    period_id: ancient
    priority: 1
    state: pending
    targets: [characters/ROM.yml, locations]
    source_refs: [suetonius_caligula, suetonius_nero]
    question: Which existing EU5 location covers Antium, and how precise is that mapping?
    acceptance: Record the historical place and verified location ID before replacing the old Rome birthplace approximation.
  roman_duplicate_ids:
    period_id: ancient
    priority: 2
    state: pending
    targets: [characters/ROM.yml, countries/ROM - Rome.yml]
    source_refs: [suetonius_caligula, suetonius_claudius]
    question: Can duplicate Caligula and Claudius IDs be reconciled without breaking historical references?
    acceptance: Audit every reference first; retain stable IDs or publish a complete alias/migration list.
  armenia_war_and_succession:
    period_id: ancient
    priority: 1
    state: pending
    targets: [wars/firstromanparthianwar.txt, countries/ARM - Armenia.yml]
    source_refs: [iranica_armenia, iranica_vologases]
    question: Which dates and war phases are supported for Corbulo's campaign and Tigranes' appointment?
    evidence: >-
      The source places the campaign in spring 58 and Tigranocerta's surrender
      in spring 59. Existing data uses 58.2.1 for the war and 58.7.1 for the
      ruler change. These exact days have not been verified. Tigranes numbering
      differs between scholarly accounts.
    acceptance: Preserve year/season uncertainty and avoid forcing a precise game day without a documented conversion policy.
  abbassid_capital_mapping:
    period_id: medieval
    priority: 2
    state: pending
    targets: [countries/ABBA - Abbasid.yml, locations]
    source_refs: [met_abbasid]
    question: Are the Baghdad and Samarra capital changes already present, and which location IDs represent them?
    evidence: >-
      The 58 CE cities batch marks the Baghdad tile with the Seleucia-Ctesiphon
      reading at 58.2.1; a dated 762 change for Baghdad itself is still to be modeled.
    acceptance: Verify existing timeline keys and mapping before adding year-level events; Baghdad foundation does not erase earlier settlements in its location.
  eic_full_archive_review:
    period_id: early_modern
    priority: 2
    state: pending
    targets: [research/early_modern/2026-10-13_eic.yml]
    source_refs: [bl_eic]
    question: Obtain the full IOR/B catalogue and charter text beyond the indexed excerpt.
    acceptance: Verify charter scope and organizational representation; do not convert incorporation into territorial ownership.
  railway_route_mapping:
    period_id: industrial
    priority: 2
    state: pending
    targets: [locations]
    source_refs: [nrm_stockton_darlington, smg_rocket]
    question: How should dated routes, railway infrastructure and locomotive evidence be represented?
    acceptance: Map the actual route to existing location IDs and distinguish an opening event from nationwide adoption.
  un_membership_mapping:
    period_id: contemporary
    priority: 2
    state: pending
    targets: [international_organizations]
    source_refs: [un_founders]
    question: Map all 51 founding states and their effective dates to repository tags.
    acceptance: Separate signature and ratification; do not assign every founding state membership on 24 October 1945.
  geographic_coverage:
    period_id: ancient
    priority: 1
    state: pending
    targets: [countries, characters, locations]
    source_refs: [met_han, wiki_han_economy, wiki_urban_sizes, periplus_schoff]
    question: Extend the 58 CE batch to South Asia, Africa and the Americas, and obtain stronger Eastern Han ruler sources.
    evidence: >-
      Batch "2026-10-17 58ce cities and markets" added city rank and market
      flags for 74 locations across Europe, Asia, Africa and Mesoamerica
      (economy layer, batch 1). Eastern Han ruler sources are still pending.
    acceptance: Add scoped sources and explicit uncertainties; this first batch does not establish global coverage.
  han_capital_tile_mapping:
    period_id: ancient
    priority: 1
    state: completed
    targets: [locations, "Extended Timeline/main_menu/setup/start/07_cities_and_buildings.txt", "Extended Timeline/main_menu/setup/start/14_development.txt", "Extended Timeline/main_menu/setup/start/03_markets.txt"]
    question: Which tile is the Han capital, and where should the 07 megalopolis rank and 14 development entry sit?
    evidence: >-
      The changan key resolves to a Rongzhou (Guangxi) village with Zhuang/Yao tribesmen
      pops; it was removed in c12bc57 and the rank moved to xianyang. The jingzhao tile
      carries the metropolis pop profile from the initial pop setup, Han-era character
      birthplaces and the 03 market; the 58.2.1 data flags were moved there on 2026-10-17.
    resolution: >-
      Confirmed jingzhao as the unified Western Han metropolis tile. 03 market, 07 megalopolis
      rank, and 14 development 12 are all aligned on jingzhao across mod and data workspace.
    acceptance: Maintainer confirms the final tile (jingzhao proposed); 03 market, 07 rank and 14 development end up on the same location.
  ancient_economy_roads_and_town_ranks:
    period_id: ancient
    priority: 2
    state: pending
    targets: [locations]
    source_refs: [periplus_schoff, wiki_urban_sizes]
    question: Which dated roads adjacency and town-level ranks belong to the 58 CE economy layer (batch 2)?
    acceptance: Add only evidence-backed neighbor-name road maps and town ranks; re-read the Location Files doc before editing.
  ancient_city_setup_field:
    period_id: ancient
    priority: 3
    state: pending
    targets: [locations]
    source_refs: []
    question: Which vanilla town_setups values exist, and should the 74 city locations gain a setup field?
    acceptance: Copy setup values only from verified vanilla data; do not invent setup ids.
  ancient_economy_source_upgrades:
    period_id: ancient
    priority: 2
    state: pending
    targets: [research/ancient/2026-10-17_58ce_cities_and_markets.yml, research/sources.yml]
    source_refs: [wiki_corduba, wiki_damascus, wiki_narbonne]
    question: Replace the weak sources flagged in the 58 CE cities batch (Corduba stub, Damascus intro, Narbonne colony status, Peshawar and Dunhuang intros) with stronger references.
    acceptance: Keep findings and confidence levels in sync with any replacement; do not silently drop caveats.
  location_tile_identifications:
    period_id: ancient
    priority: 2
    state: pending
    targets: [locations]
    source_refs: [wiki_urban_sizes, periplus_schoff]
    question: Which tiles cover Rhodes, Paithan, Memphis, Berenice, Istakhr and Yangzhou/Guangling, and how precise are the approximations already noted (Petra, Artaxata, Taxila, Cyrene, Chang'an, Linzi, Dunhuang)?
    acceptance: Verify filename uniqueness and document distances in records; postpone tile renames.
  historical_events_and_culture_transition:
    period_id: ancient
    priority: 1
    state: in_progress
    targets: [research/historical-events/README.md, research/historical-events/2026-10-17_egypt_culture_transition.yml, research/historical-events/2026-10-17_egypt_event_design.md, research/historical-events/2026-10-17_gaul_culture_transition.yml]
    source_refs: [wiki_islamization_egypt, wiki_coptic_language, tacitus_annales_claudius, caracalla_constitutio_antoniniana, caesar_de_bello_gallico]
    question: Which region pilots the historical events and culture transition layer, and are intermediate identities (e.g. gallo_roman) needed between the 58 CE cultures and the modern keys?
    evidence: >-
      The 58 CE start leaves large ancient culture blocs (roman, germanic, slavic,
      gallian, ancient_greek, old_egyptian) while modern identities carry almost no
      pops; the engine only assimilates pops toward the owner's primary culture and
      never splits cultures on its own, so historical differentiation requires a
      script layer. The plan at research/historical-events/README.md records verified
      EU5 1.3.x tools (change_pop_culture, change_pop_religion, form_new_culture,
      merge_culture_group, change_language, add_migration) and phases the work
      data-first; the mod has no events or on_action layer yet. Maintainers confirmed
      Gaul (Galya) as the Phase 1 pilot region with gallo_roman intermediate identity.
      The 2026-10-17 working session selected Mısır (Egypt) as the pilot region and
      collected sourced transition records for the Egyptian chain (old_egyptian ->
      coptic_culture -> lower/upper egyptian, plus kushite -> nubian) in
      historical-events/2026-10-17_egypt_culture_transition.yml; the culture graph gaps
      for old_egyptian, kushite and gallian were fixed in the mod the same day. The
      Mısır pilot needs no new culture keys.
      RESOLVED (2026-10-17): the two decisions run as parallel Phase 1 tracks — Mısır
      (Egypt: records and WS3 fixes collected, design note published in
      historical-events/2026-10-17_egypt_event_design.md; five-event chain planned via
      tag-agnostic yearly on_action pulse) and Gaul (Galya: gallo_roman intermediate identity,
      sourced records collected in historical-events/2026-10-17_gaul_culture_transition.yml,
      gallo_roman defined in mod, and pilot events et_culture.101 to et_culture.103
      implemented with English and Turkish localization). Neither track blocks the other.
      UPDATE (2026-10-17, Egypt track): the Egyptian chain is now implemented in the mod -
      et_culture.1 to et_culture.5 in in_game/events/et_culture_events.txt, fired by
      et_egypt_yearly_pulse in the new file in_game/common/on_action/et_history_pulses.txt
      (vanilla yearly_country_pulse hook; owner-agnostic, one-shot per country via
      variables), with English and Turkish localization; the et_culture.9000 test event
      stays until in-game validation. The numbering agreement is realized: the Gaul pilot
      was renumbered to et_culture.101-103, leaving .1-.49 to Egypt (.100-.149 Gaul).
      TEST A PASSED (2026-10-17): the template event et_culture.9000 and the Gaul event
      et_culture.101 both fired in a live 58 CE start, and the session's error.log holds
      no mod-related line. Test B (chain) uses the verified EU5 console protocol
      (event, test_event_trigger, event_probabilities, change_date, tick_day) instead of
      temporary 58.x windows; protocol recorded in the design note, section 5.
      UPDATE 2 (2026-10-17, Egypt track): Samet's review commit f3d304d aligned the
      chain with the spec (event .2 resistance 0.05->0.15; event .3 window to
      650-1100) and materialized the Egyptian end-state keys inside the mod
      (coptic/lower/upper egyptian cultures in et_egypt.txt; coptic/arabic
      languages in 00_et_african.txt; miaphysite in et_christianity.txt) using the
      mod's established implicit-override pattern (the mod never uses REPLACE:;
      filenames sort after vanilla). Possible content loss in the vanilla-owned
      definitions (arabic dialect block referenced by ~30 vanilla cultures and by
      the mod's own et_muslim islam religion; character name pools; culture
      opinions/goods_demand_modifier; miaphysite autocephaly features) and the .5
      upper-Egypt resistance sync (spec 0.15 vs script 0.25) are flagged as
      maintainer confirmations in the design note, section 7 (items 7-8). Test B
      remains the next step.
      UPDATE 3 (2026-10-17, Egypt track): second review applied the ownership
      decision - vanilla-shadowing copies without a real delta were removed
      (arabic_language, coptic_language, lower/upper egyptian cultures, miaphysite's
      simplified version), restoring the vanilla definitions intact (seven Arabic
      dialects, character name pools, culture opinions/goods_demand_modifier,
      miaphysite autocephaly/canonization/religious_aspects); the two real deltas
      stay as verbatim vanilla plus delta (coptic_culture + arabic_group; miaphysite
      + language = coptic_language); the .5 upper-Egypt resistance returns to the
      spec value 0.15. Invalid gfx tags from the removed blocks dropped with them;
      the remainder stays in invalid_culture_gfx_tags. Test B remains the next step.
    acceptance: Maintainers confirm the pilot region and the intermediate-identity policy; phase 1 collects sourced transition records under research/historical-events before any event script is written in the mod.
  culture_group_gaps_remaining:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/common/cultures/et_balkans.txt, Extended Timeline/in_game/common/cultures/et_persian.txt, Extended Timeline/in_game/common/cultures/et_south_east_asia.txt, Extended Timeline/in_game/common/cultures/et_missing.txt]
    source_refs: []
    question: Which successor culture groups should the remaining groupless mod cultures receive (pannonian, illyrian, tocharian, pyu, pear, and the et_missing fallback set)?
    evidence: >-
      The 2026-10-17 WS3 scan flagged 39 culture records; the Egypt pilot fixed
      old_egyptian and kushite and the plan-flagged gallian link. The remaining
      non-East-Asia entries are triaged in
      research/historical-events/2026-10-17_culture_graph_audit.md; the 26-entry
      East Asia cluster mirrors vanilla groupless isolates and is out of scope.
    acceptance: Assign only groups with a documented successor relation using vanilla group ids; leave intentionally isolate cultures groupless.
  invalid_culture_gfx_tags:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/common/cultures/et_egypt.txt, Extended Timeline/in_game/common/cultures/et_missing.txt]
    source_refs: []
    question: Which mod culture files use gfx tags that are not defined in the vanilla graphical culture types list?
    evidence: >-
      The 2026-10-17 key scan cross-checked mod culture tags against
      in_game/gfx/graphical_culture_types: middle_eastern_gfx (et_egypt.txt:35,
      et_missing.txt:124/132/148) is not defined; the further candidates
      north_african_gfx (et_missing.txt:132), iranian_gfx (et_missing.txt:148)
      and steppe_gfx (et_missing.txt:156) are absent as well (the arabic_gfx
      usages were removed on 2026-10-17 together with the shadow culture blocks).
      Valid neighbours include middle_east_gfx, arabian_gfx, maghrebi_gfx,
      persian_gfx and egyptian_gfx.
    acceptance: Replace only with tags verified in the vanilla list; keep regional intent reviewed by maintainers; graphics fallback is the expected current effect.
