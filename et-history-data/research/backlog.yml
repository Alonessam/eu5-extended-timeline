      retitled 58 -> 2026 to match the extended campaign. The single modern
      phase was split at the project's period boundary (docs/Period Classes.md:
      industrial 1800-1945, contemporary 1945+): Faz 7 = Modern France
      1837-1945 (.119-.121) and Faz 8 = Contemporary France 1945-2026 (.122
      plus the postwar immigration layer, filed as gaul_postwar_immigration_layer
