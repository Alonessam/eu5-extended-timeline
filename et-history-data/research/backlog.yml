  ancient_city_setup_field:
    period_id: ancient
    priority: 3
    state: completed
    targets: ["Extended Timeline/main_menu/setup/start/07_cities_and_buildings.txt", research/ancient/2026-10-17_58ce_cities_and_markets.yml]
    source_refs: []
    question: Which vanilla town_setups values exist, and should the 74 city locations gain a setup field?
    evidence: >-
      The vanilla city file main_menu/setup/start/07_cities_and_buildings.txt
      defines 1,019 cities with 114 distinct town_setup values. The mod's 58 CE
      city file defines 140 cities with 38 distinct values, and every one of
      the 38 exists in vanilla, so no setup id is invented. The 74 research
      records write the city rank and the market flag into the 58.2.1 block of
      the location files, while the setup id itself lives on the game side in
      the city file with an explanatory comment.
    resolution: >-
      Resolved on 20 Oct 2026: the setup ids are verified against the vanilla
      city file (38/38), and the research layer does not need a separate setup
      field, because the value is a game-side property that the 58 CE city
      file already carries with its historical comment. Note:
      research/historical-events/2026-10-20_map_tile_and_setup_audit.md.
    acceptance: Copy setup values only from verified vanilla data; do not invent setup ids. Met on 20 Oct 2026, all 38 setup values are vanilla values and no research-side setup field is needed.
  ancient_economy_source_upgrades:
    period_id: ancient
    priority: 2
    state: pending
    targets: [research/ancient/2026-10-17_58ce_cities_and_markets.yml, research/sources.yml]
