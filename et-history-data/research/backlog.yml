      (2026-10-17_egypt_event_design.md, section 2.1) rejected DHE for
      owner-dependent regions and uses a narrow yearly_country_pulse instead.
      Decide before Test B: either document that the Gaul chain is a historical
      world layer for ROM/FRA and add that test case, or move the events to a
      date-guarded yearly pulse (the DHE windows must become explicit date
      triggers) so any owner of Paris runs the chain.
      UPDATE 9 (2026-10-18, decision): the chain stays a DHE-held historical
      world layer, but the binding now follows the historical actors: ROM
      (.101-.109), FRAN (.110-.113) and FRA (.114-.123). DHE is single-tag by
      construction (Egypt design note 2.1); rebinding .110-.113 to FRAN gives
      the Frankish kingdom its own layer and ends the ROM->FRA mismatch.
      The FRAN/FRA boundary follows the rex Francorum -> rex Franciae shift
      (Philip II, 1190/1204). Remaining: Test B must include the ROM -> FRAN
      hand-off case; .109 and .110 sit on different tags, so no double firing.
