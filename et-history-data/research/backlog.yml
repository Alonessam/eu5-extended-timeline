    acceptance: Verify filename uniqueness and document distances in records; postpone tile renames.
  historical_events_and_culture_transition:
    period_id: ancient
    priority: 1
    state: in_progress
    targets: [research/historical-events/README.md, research/historical-events/2026-10-17_egypt_culture_transition.yml, research/historical-events/2026-10-17_egypt_event_design.md, research/historical-events/2026-10-17_gaul_culture_transition.yml]
    source_refs: [wiki_islamization_egypt, wiki_coptic_language, tacitus_annales_claudius, caracalla_constitutio_antoniniana, caesar_de_bello_gallico]
    question: Which region pilots the historical events and culture transition layer, and are intermediate identities (e.g. gallo_roman) needed between the 58 CE cultures and the modern keys?
    evidence: >-
      The 58 CE start leaves large ancient culture blocs (roman, germanic, slavic,
      gallian, ancient_greek, old_egyptian) while modern identities carry almost no
      pops; the engine only assimilates pops toward the owner's primary culture and
      never splits cultures on its own, so historical differentiation requires a
      script layer. The plan at research/historical-events/README.md records verified
      EU5 1.3.x tools (change_pop_culture, change_pop_religion, form_new_culture,
      merge_culture_group, change_language, add_migration) and phases the work
      data-first; the mod has no events or on_action layer yet. Maintainers confirmed
      Gaul (Galya) as the Phase 1 pilot region with gallo_roman intermediate identity.
      The 2026-10-17 working session selected Mısır (Egypt) as the pilot region and
      collected sourced transition records for the Egyptian chain (old_egyptian ->
      coptic_culture -> lower/upper egyptian, plus kushite -> nubian) in
      historical-events/2026-10-17_egypt_culture_transition.yml; the culture graph gaps
      for old_egyptian, kushite and gallian were fixed in the mod the same day. The
      Mısır pilot needs no new culture keys.
      RESOLVED (2026-10-17): the two decisions run as parallel Phase 1 tracks — Mısır
      (Egypt: records and WS3 fixes collected, design note published in
      historical-events/2026-10-17_egypt_event_design.md; five-event chain planned via
      tag-agnostic yearly on_action pulse) and Gaul (Galya: gallo_roman intermediate identity,
      sourced records collected in historical-events/2026-10-17_gaul_culture_transition.yml,
      gallo_roman defined in mod, and pilot events et_culture.101 to et_culture.103
      implemented with English and Turkish localization). Neither track blocks the other.
    acceptance: Maintainers confirm the pilot region and the intermediate-identity policy; phase 1 collects sourced transition records under research/historical-events before any event script is written in the mod.
  culture_group_gaps_remaining:
    period_id: ancient
    priority: 3
    state: pending
    targets: [Extended Timeline/in_game/common/cultures/et_balkans.txt, Extended Timeline/in_game/common/cultures/et_persian.txt, Extended Timeline/in_game/common/cultures/et_south_east_asia.txt, Extended Timeline/in_game/common/cultures/et_missing.txt]
    source_refs: []
    question: Which successor culture groups should the remaining groupless mod cultures receive (pannonian, illyrian, tocharian, pyu, pear, and the et_missing fallback set)?
    evidence: >-
      The 2026-10-17 WS3 scan flagged 39 culture records; the Egypt pilot fixed
      old_egyptian and kushite and the plan-flagged gallian link. The remaining
      non-East-Asia entries are triaged in
      research/historical-events/2026-10-17_culture_graph_audit.md; the 26-entry
      East Asia cluster mirrors vanilla groupless isolates and is out of scope.
    acceptance: Assign only groups with a documented successor relation using vanilla group ids; leave intentionally isolate cultures groupless.
