tasks:
  roman_succession_dates:
    period_id: ancient
    priority: 1
    state: pending
    targets: [characters/ROM.yml, countries/ROM - Rome.yml]
    source_refs: [suetonius_augustus, suetonius_tiberius]
    question: Distinguish the ruler's death from de facto succession and formal recognition.
    evidence: >-
      Augustus death is sourced to 14.8.19 while the existing character and
      country transition use 14.9.18. Tiberius death is sourced to 37.3.16
      while the existing character and country transition use 37.3.18.
    acceptance: Apply linked timelines together with explicit dating and modeling notes; do not leave a dead ruler selected accidentally.
  antium_location_mapping:
