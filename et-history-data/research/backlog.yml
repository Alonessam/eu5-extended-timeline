    targets: [countries/ABBA - Abbasid.yml, locations]
    source_refs: [met_abbasid]
    question: Are the Baghdad and Samarra capital changes already present, and which location IDs represent them?
    evidence: >-
      The 58 CE cities batch marks the Baghdad tile with the Seleucia-Ctesiphon
      reading at 58.2.1; a dated 762 change for Baghdad itself is still to be modeled.
    acceptance: Verify existing timeline keys and mapping before adding year-level events; Baghdad foundation does not erase earlier settlements in its location.
  eic_full_archive_review:
