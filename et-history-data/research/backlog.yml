  gaul_postwar_immigration_layer:
    period_id: contemporary
    priority: 3
    state: completed
    targets: [research/historical-events/2026-10-17_gaul_culture_transition.yml, "Extended Timeline/in_game/events/et_culture_events.txt"]
    source_refs: [wiki_languages_of_france, wiki_immigration_to_france, wiki_portuguese_in_france]
    question: Should the postwar immigration wave (1945-1975; Maghrebi, Portuguese, Italian and other labour migration into French cities) receive a culture or religion event in the Gaul chain?
    evidence: >-
      The Languages of France record lists Arabic (about 3.6 percent of mother
      tongues), Berber, Portuguese, Spanish, Italian and Turkish as the main
      immigrant languages of modern France, but the Gaul chain has no event for
      the demographic change itself. Adding one needs valid immigrant culture
      keys and a scoped add_pop pattern; the 1905 laicite event already notes
      that no secular religion key exists. This is the Faz 8 (1945-2026) content
      gap: after the 2026-10-18 Faz 7/8 split, Faz 8 holds only .122, so this
      task is what would flesh the phase out.
    resolution: >-
      Completed 2026-10-18 (UPDATE 9). The event et_culture.122 "The Trente
      Glorieuses" (1945-1975) adds Portuguese, Algerian, Moroccan, Kabyle and
      Turkish labourer pops, plus Piedmontese and Neapolitan for the Italian
      stream and Castilian for the Spanish stream, to the industrial cities via
      location-scoped add_pop.
      Every culture key was verified against vanilla common/cultures (portuguese,
      castilian, algerian, moroccan, kabyle, turkish_culture, piedmontese and
      neapolitan all exist; there is no umbrella italian or spanish key, so the
      regional cultures stand in), and no religion key was invented (catholic and
      sunni are vanilla). The sources wiki_immigration_to_france and
      wiki_portuguese_in_france and the record
      gaul_postwar_labour_immigration_1945_1975 were added first.
    acceptance: Only add if a source-backed culture-key path exists; do not invent immigrant culture or religion keys.
