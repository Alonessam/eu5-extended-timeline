schema_version: 1
updated_on: "2026-10-20"
tasks:
  roman_succession_dates:
    period_id: ancient
    priority: 1
    state: completed
    targets: [et-history-data/characters/ROM.yml, "et-history-data/countries/ROM - Rome.yml", "Extended Timeline/main_menu/setup/start/05_characters.txt"]
    source_refs: [suetonius_augustus, suetonius_tiberius]
    question: Distinguish the ruler's death from de facto succession and formal recognition.
    evidence: >-
      The sourced deaths - Augustus on 19 August 14 CE, Tiberius on 16 March 37 CE - were
      left unapplied because the character death key and the country ruler key
      are coupled: the mod used 14.9.18 and 37.3.18 in both places, so the
      dates could not be changed in isolation. The 20 Oct 2026 audit also found
      that the mod's 58 CE start state is ruled by Nero (government = {ruler =
      rom_nero_julio_claudian}), so the generated country files carry no
      historical ruler chain; only the research country file does.
    resolution: >-
      Applied together on 20 Oct 2026 with a documented policy: the country
      timeline follows the de facto succession, which in both cases falls on
      the death day, so the character death date and the country ruler key
      both use 14.8.19 and 37.3.16 and no dead ruler is ever the selected one.
      A formal recognition that the engine cannot model (the Senate's
      acclamation of Caligula on 18 March 37) is kept in the research records
      instead of the timeline. The change reached the research character and
      country files and the three generated character files plus the mod's
      setup file.
    acceptance: Apply linked timelines together with explicit dating and modeling notes; do not leave a dead ruler selected accidentally. Met on 20 Oct 2026, both timelines carry the sourced death days and the policy is written into the records.
  antium_location_mapping:
    period_id: ancient
    priority: 1
    state: completed
    targets: [et-history-data/characters/ROM.yml, research/ancient/2026-10-13_rome_and_east.yml, "Extended Timeline/main_menu/setup/start/05_characters.txt"]
    source_refs: [suetonius_caligula, suetonius_nero]
    question: Which existing EU5 location covers Antium, and how precise is that mapping?
    evidence: >-
      The sources favour Antium for Caligula and Nero, but EU5 1.3.x has no
      Antium key. The Latium province (marittima_province) holds only three
      locations - rome, terracina and velletri - and Antium (modern Anzio)
      lies about 52 km from Rome and about 89 km from Terracina on the same
      coast. The mod's own convention names the actual birthplace settlement
      (mosul, massawa, kotte, pondicherry), not the nearest metropolis.
    resolution: >-
      Resolved on 20 Oct 2026 and written up as the research record
      antium_location_mapping: the birthplace key is terracina, a small
      coastal Latium town of the same type, with rome documented as the
      closer but type-wrong alternative. Caligula (both IDs) and Nero now
      carry birth: terracina in et-history-data/characters/ROM.yml, in the
      generated 58/2025/936 character files and in the mod's setup file.
    acceptance: Record the historical place and verified location ID before replacing the old Rome birthplace approximation. Met on 20 Oct 2026, the record exists and the four data files carry terracina.
  roman_duplicate_ids:
    period_id: ancient
    priority: 2
    state: completed
    targets: [et-history-data/characters/ROM.yml, "Extended Timeline/main_menu/setup/start/05_characters.txt"]
    source_refs: []
    question: Can duplicate Caligula and Claudius IDs be reconciled without breaking historical references?
    evidence: >-
      The reference audit on 20 Oct 2026 found 15 references to
      rom_caligula_julio_claudian, 10 to rom_caligula_julio_claudian_1 and 11
      to rom_claudius_julio_claudian: the country file's ruler chain uses the
      _1 variants, the character links point at them (Claudius's father link
      named rom_caligula_julio_claudian_1) and the three generated character
      files repeat them. The mod's setup file had also drifted from the
      research file: the _1 variants still carried the unsourced dates
      (7.1.1, 2.1.1, 11.1.1) and the false father links that the research
      layer had already removed.
    resolution: >-
      Reconciled on 20 Oct 2026 without renaming anything, so no alias or
      migration list is needed: the duplicate pairs carry identical sourced
      data in every file (Caligula 12.8.31, Claudius -10.8.1 at lyon), the
      false father links (Caligula to Tiberius, Claudius to Caligula) were
      removed as the records require, and the country file's ruler chain keeps
      referring to the same IDs. Germanicus and Drusus would each need their
      own verified record before the father links can be restored
      (julio_claudian_parent_characters).
    acceptance: Audit every reference first; retain stable IDs or publish a complete alias/migration list. Met on 20 Oct 2026, every reference was audited, the IDs were retained and the duplicate data aligned.
  julio_claudian_parent_characters:
    period_id: ancient
    priority: 3
    state: pending
    targets: [et-history-data/characters/ROM.yml, "Extended Timeline/main_menu/setup/start/05_characters.txt"]
    source_refs: [suetonius_caligula, suetonius_claudius]
    question: Should Germanicus (Caligula's father) and Drusus (Claudius's father) be added as characters, so the Julio-Claudian family tree stops at the emperors?
    evidence: >-
      The 20 Oct 2026 reconciliation removed the false father links instead of
      inventing parents: Caligula's father was Germanicus (Suetonius, Caligula
      7-8), not Tiberius, and Claudius's father was Drusus (Suetonius, Claudius
      1.1 and 1.6), not Caligula. The research records caligula_father and
      claudius_father already state that a character with its own verified
      record is needed. Both men are attested (Germanicus died in 19 CE,
      Drusus in 9 BCE), so the records can be written from Suetonius.
    resolution: >-
      Pending. The data-first rule applies: each character needs a sourced
      record (birth, death, titles, family links) before the father link can
      be restored in the character files.
    acceptance: Germanicus and Drusus each have a sourced record and the father links are restored in the research and mod character data.
  armenia_war_and_succession:
    period_id: ancient
    priority: 1
    state: pending
    targets: [wars/firstromanparthianwar.txt, countries/ARM - Armenia.yml]
    source_refs: [iranica_armenia, iranica_vologases]
    question: Which dates and war phases are supported for Corbulo's campaign and Tigranes' appointment?
    evidence: >-
      The source places the campaign in spring 58 and Tigranocerta's surrender
      in spring 59. Existing data uses 58.2.1 for the war and 58.7.1 for the
      ruler change. These exact days have not been verified. Tigranes numbering
      differs between scholarly accounts.
    acceptance: Preserve year/season uncertainty and avoid forcing a precise game day without a documented conversion policy.
  abbassid_capital_mapping:
    period_id: medieval
    priority: 2
    state: completed
    targets: ["et-history-data/countries/ABBA - Abbasid.yml", research/medieval/2026-10-13_abbasid.yml]
    source_refs: [met_abbasid]
    question: Are the Baghdad and Samarra capital changes already present, and which location IDs represent them?
    evidence: >-
      The country file already carried the capital changes - 762.7.30 baghdad,
      796.1.1 raqqa, 809.1.1 baghdad, 836.1.1 tikrit and 892.1.1 baghdad -
      but the 836 entry used tikrit, a different settlement in the same
      province, so the Samarra capital interval was represented by the wrong
      location. The map confirms both real keys: baghdad in baghdad_province
      and samarra in samarra_province.
    resolution: >-
      Resolved on 20 Oct 2026: the 836 capital key is now samarra, and the
      three capital records carry the verified location IDs and the applied
      status. The 762 day is an EU4 import day and the notes keep the year
      precision of the records; the 1 January markers are the repository
      year-level convention. The 58 CE Seleucia-Ctesiphon reading of the
      baghdad tile is unaffected - a city foundation does not erase the
      earlier settlement. Note:
      research/historical-events/2026-10-20_map_tile_and_setup_audit.md.
    acceptance: Verify existing timeline keys and mapping before adding year-level events; Baghdad foundation does not erase earlier settlements in its location. Met on 20 Oct 2026, the keys are verified, the 836 entry points at samarra and the earlier settlement is documented.
  eic_full_archive_review:
