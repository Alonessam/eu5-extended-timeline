    targets: ["Extended Timeline/in_game/events/et_culture_events.txt", "research/historical-events/2026-10-17_egypt_event_design.md"]
    source_refs: [wiki_islamization_egypt]
    question: How do the Egypt chain's fractions reach the record's ten-to-one Muslim-Christian ratio?
    evidence: >-
      The record states a Muslim-to-Christian ratio near ten to one by the end
      of the Mamluk period, and the design note left the calibration to test
      data. A static computation over the 58 CE setup (old_egyptian +
      egyptian_polytheism: Delta 3,468.2, Upper Egypt 1,308.8) gives 1:3.2
      after the current waves (.1/.2/.3/.4), so the existing fractions cannot
      reach the target and a balance wave is required. Two options were
      weighed: raising the .3/.4 fractions (which would need 0.87-0.89 in .4,
      that is a single near-total flip, which breaks the gradual design) or a
      separate Mamluk-era wave (the design note's own .4b sketch).
    resolution: >-
      The separate wave was implemented on 20 Oct 2026: et_culture.9 "The
      Mamluk Wave" (1300-1500, Delta 0.65 and Upper Egypt 0.55 of the
      remaining Christian and polytheist pool, chained on the .4 historical
      variable) with EN/TR localization. The static prediction is Delta 90
      percent Muslim against 8.6 percent Christian, Upper Egypt 81 against 9.3,
      combined about 1:9.7. The two fractions are the calibration knob: the
      Test B panel reading decides whether they move.
