  gaul_gallic_empire_effect_fix:
    period_id: ancient
    priority: 2
    state: completed
    targets: ["Extended Timeline/in_game/events/et_culture_events.txt", "Extended Timeline/in_game/localization/english/et_culture_events_l_english.yml", "Extended Timeline/in_game/localization/turkish/et_culture_events_l_turkish.yml", "research/historical-events/2026-10-17_gaul_culture_transition.yml"]
    source_refs: [wiki_gallic_empire]
    question: What should the Imperium Galliarum event do in 260-274, given that the population identity does not change during the secession?
    evidence: >-
      The 20 Oct 2026 chain audit found that et_culture.105's historical
      option could not change any pop: its limit required gallian nobles,
      clergy and burghers in the nine city locations, and .101 had already
      converted exactly those pops to gallo_roman in 58-100. This is the same
      "historical option runs empty" class that the 18 Oct audit found in
      .107 (fixed by widening the limit to gallian OR gallo_roman); widening
      cannot help here because the target culture is already the pops'
      culture. The record gaul_gallic_empire_260_274 describes the secession
      as a frontier-army political breakaway, not a population change. The
      same scan was run over all 23 Gaul events: every other historical option
      consumes a population that is still alive at its window, so .105 was the
      only inert conversion (note section 4).
    resolution: >-
      The event was rewritten as a political event on 20 Oct 2026: option A
      (historical) ends the breakaway with Aurelian's reconquest (stability
      +10, prestige bonus), option B lets the provinces break away for good
      (stability -10, prestige penalty). The inert custom_tooltip block and
      the et_culture.105.tt key were removed, the EN/TR desc/a/b strings were
      rewritten, and the record's integration note now describes the political
      branch. No Gallic-Empire culture key was invented: the corpus has no
      source-backed Gallic name pool, and a temporary identity would need a
      restoration event that would break the chronological event-ID order.
      Note: research/historical-events/2026-10-20_gaul_chain_audit.md
      section 3.
    acceptance: The .105 historical option has a visible effect (stability and prestige) and the event text matches the record; the runtime check is the R2 stop at 266 in Test B.
  gaul_dhe_tag_binding_review:
    period_id: medieval
    priority: 2
    state: completed
    targets: ["Extended Timeline/in_game/events/et_culture_events.txt", "Extended Timeline/in_game/common/on_action/et_history_pulses.txt"]
    source_refs: [wiki_style_of_the_french_sovereign]
    question: Should the Gaul chain keep the dynamic_historical_event tag binding (ROM for .101-.109, FRAN for .110-.113, FRA for .114-.123) or move to the owner-agnostic yearly-pulse pattern used by the Egypt chain?
    evidence: >-
      All 23 Gaul events are DHE-bound: .101-.109 require ROM, .110-.113
      require FRAN and .114-.123 FRA (all-ROM/all-FRA before the UPDATE 13
      decision). A country that owns Paris but is none of these (for
      example a Gallic tag, a surviving Roman successor or a player-formed
      state) never receives the chain, and no single country spans both halves
      because ROM does not form FRA. The Egypt design note
      (2026-10-17_egypt_event_design.md, section 2.1) rejected DHE for
      owner-dependent regions and uses a narrow yearly_country_pulse instead.
      Decide before Test B: either document that the Gaul chain is a historical
      world layer for ROM/FRA and add that test case, or move the events to a
      date-guarded yearly pulse (the DHE windows must become explicit date
      triggers) so any owner of Paris runs the chain.
      UPDATE 9 (2026-10-18, decision): the chain stays a DHE-held historical
      world layer, but the binding now follows the historical actors: ROM
      (.101-.109), FRAN (.110-.113) and FRA (.114-.123). DHE is single-tag by
      construction (Egypt design note 2.1); rebinding .110-.113 to FRAN gives
      the Frankish kingdom its own layer and ends the ROM->FRA mismatch.
      The FRAN/FRA boundary follows the rex Francorum -> rex Franciae shift
      (Philip II, 1190/1204). Remaining: Test B must include the ROM -> FRAN
      hand-off case; .109 and .110 sit on different tags, so no double firing.
      UPDATE 24 (2026-10-20, static verification): the event file matches the
      decision for all 23 events - ROM for .101-.109, FRAN for .110-.113, FRA
      for .114-.123 - and every event carries fire_only_once = yes, so no
      event can fire twice. The hand-off is double-firing free: .109 (ROM,
      457-486) and .110 (FRAN, 496-508) sit on different tags with
      non-overlapping windows. Window overlaps inside a band are documented
      and accepted (.102/.103, .103 containing .104/.105, .106/.107, .107
      containing .108); they touch different effects. The accepted limitation
      stands: a non-ROM/FRAN/FRA owner of Paris never runs the chain, which
      is logged in the Test B report instead of being engineered around.
    resolution: >-
      Decision confirmed and verified offline on 20 Oct 2026; the DHE band
      binding stays. Note: research/historical-events/2026-10-20_gaul_chain_audit.md
      section 2, with the per-event tag/window table. The Test B execution
      cases are already in the protocol (R2 `list_dhe_for` for ROM, R3 for
      FRAN and FRA, plus the ROM -> FRAN tag change).
    acceptance: Decision recorded in the design note/README; Test B includes an owner-switch or non-ROM/FRAN/FRA case; no double firing. Decision and static verification met on 20 Oct 2026; the runtime cases stay on Test B.
  gaul_history_audit_followups:
    period_id: contemporary
    priority: 2
    state: completed
    targets: ["Extended Timeline/in_game/events/et_culture_events.txt", "Extended Timeline/in_game/localization/english/et_culture_events_l_english.yml", "Extended Timeline/in_game/localization/turkish/et_culture_events_l_turkish.yml"]
    source_refs: [weber_peasants_into_frenchmen, wiki_languages_of_france]
    question: How should the non-critical Gaul audit findings be resolved - the frankish culture that never becomes french, the full-population culture flips in .109/.114/.118, and the Turkish and English copy defects?
    evidence: >-
      The 2026-10-18 audit of .101-.123 (UPDATE 10) left the following.
      (a) Chain logic: .109 flips every gallo_roman pop in paris, reims, rouen
      and soissons to frankish, but no later event converts frankish to french
      (.111 covers gallo_roman, .115 covers norman/arpitan, .118 covers
      occitan/arpitan/norman), so with the historical options northern France
      ends the chain as frankish even though the Franks were a small elite that
      assimilated into a Romance population; .114 (1209-1229) and .118
      (1789-1794) likewise flip entire populations (Occitan/Arpitan/Norman) to
      french decades or centuries before the gradual linguistic unification
      documented by Weber. The accepted fix is a partial split_pop instead of a
      total change_pop_culture, with frankish added to the .115/.118 conversion
      set. (b) Turkish copy: .105 amfiatrosunda (should be amfiteatrosunda) and
      oncuelenir (non-word), Galo-Romen vs Gallo-Romen, .107 kutsal
      kahramanlarini (EN saints -> azizlerini), .112 dogum ebeveyni (EN midwife
      -> ebe), .120 ansiklikleriyle (-> ansiklikalariyla), .106 pagan kutsal
      pinarlarindan. (c) English copy: laicite/Poincare/union sacree are
      unaccented while Chalons, oil, Domremy, Gregoire and Villers-Cotterets
      carry accents, and the .120 "1906-1908 encyclicals" should be 1906-1907
      (the source caveat at sources.yml:496 carries the same off-by-one).
      UPDATE 11 (2026-10-18) resolved item (a): .109/.114/.118 use split_pop
      (0.25/0.30/0.50), frankish was added to the .115/.118 conversion sets, and
      the orphaned soissons was added to .111 and .115. Items (b) and (c) remain.
      UPDATE 12 (2026-10-18) resolved (b) and (c): the tr/en copy defects are fixed
      and the .120 encyclical range is now 1906-1907. All three items are closed.
    acceptance: Each item is decided and applied with the chain's historical options in mind; the frankish path and each partial flip are documented; Turkish and English strings are corrected without breaking key parity.
