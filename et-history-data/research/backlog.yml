      UPDATE 10 (2026-10-18, Gaul historical audit .101-.123): a full source-to-script
      audit of the Gaul chain fixed the critical historical errors. (a) .107 converted
      culture:gallian to breton, but .102/.103 already convert every gallian pop to
      gallo_roman, so with the historical options the event was a no-op; Armorica in
      380-500 was Gallo-Roman, so the limit now accepts gallian OR gallo_roman and the
      record entity was corrected to culture_gallo_roman. (b) .108 planted permanent
      vandal peasant pops in marseille and nimes, but the Vandals only crossed Gaul
      (406-409) toward Hispania; the two add_pop blocks were removed and the en/tr
      tooltip now names only the Burgundian and Visigothic settlements. (c) the .108
      Turkish desc and historical_info sent the Visigoths to the Mediterranean and the
      Vandals south; corrected to Aquitaine (418) and the Mediterranean, matching the
      English. (d) the 58 CE baseline record claimed celtic_paganism, a key that exists
      nowhere in the mod; the start setup (main_menu/setup/start/06_pops.txt, 1,039
      gallian blocks) uses gallo_roman_polytheism (et_roman.txt) and the record was
      corrected. (e) the .123 DHE window ended at 2000.1.1 while the record and the
      text describe the 1992-2008 settlement, so to is now 2009.1.1. The remaining
      audit findings (frankish never converts to french; the full-pop flips in
      .109/.114/.118; the five unsourced and nine missing records; the Turkish and
      English copy defects) are filed as gaul_history_audit_followups alongside
      gaul_record_backfill and gaul_dhe_tag_binding_review. Test B still pending.
      UPDATE 11 (2026-10-18, Gaul chain logic, audit section 2): the culture shifts
      are now gradual. .109 (gallo_roman -> frankish), .114 (occitan -> french) and
      .118 (occitan/arpitan/norman -> french) use split_pop instead of
      change_pop_culture, so those populations shift in stages rather than flipping
      wholesale. Fractions: .109 0.25 (the Franks were a small elite that
      assimilated into a Romance majority), .114 0.30 (the Albigensian Crusade
      annexed Languedoc but did not turn its population French), .118 0.50 (the
      Revolution's school and administration pressed the provinces hard but did not
      finish the work). frankish was added to the .115 and .118 conversion sets, so
      the Frankish culture now assimilates into french instead of persisting
      forever. soissons was added to the .111 and .115 location lists: .109 had made
      it frankish (and its gallo_roman was never converted) but no later event
      touched it, so it was orphaned. The en/tr .tt strings for .109/.114/.115/.118
      were rewritten to match the gradual effect. Still open from section 2: .114
      lists bordeaux, which was English Gascony and outside the Albigensian
      Crusade's reach.
