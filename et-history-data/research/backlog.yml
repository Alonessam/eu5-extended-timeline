    question: Replace the weak sources flagged in the 58 CE cities batch (Corduba stub, Damascus intro, Narbonne colony status, Peshawar and Dunhuang intros) with stronger references.
    acceptance: Keep findings and confidence levels in sync with any replacement; do not silently drop caveats.
  location_tile_identifications:
    period_id: ancient
    priority: 2
    state: completed
    targets: [research/ancient/2026-10-17_58ce_cities_and_markets.yml, "Extended Timeline/main_menu/setup/start/07_cities_and_buildings.txt"]
    source_refs: []
    question: Which tiles cover Rhodes, Paithan, Memphis, Berenice, Istakhr and Yangzhou/Guangling, and how precise are the approximations already noted (Petra, Artaxata, Taxila, Cyrene, Chang'an, Linzi, Dunhuang)?
    evidence: >-
      The map was read directly from the installed EU5 1.3.x definitions.txt.
      Rodos and patna exist as tiles with the same names as the places, so
      both are exact. memphis, berenice and istakhr have no tile at all
      (the closest are damanhur in the Delta, suakin on the far southern Red
      Sea and isfahan for Istakhr). yangzhou and guangling exist but as
      homonyms in Shaanxi and Shanxi, so they do not cover the historical
      Yangzhou and Guangling; the lower Yangtze is represented by wuxian. The
      already documented approximations (Petra to maan, Artaxata to yerevan,
      Taxila to rawalpindi, Cyrene to al_bayda, Chang'an to jingzhao, Linzi to
      yidu_qingzhou, Carthage to tunis, Korkai to thoothukudi, Muziris to
      kodungallur) were re-checked in the record notes and no new
      approximation was found.
    resolution: >-
      Documented on 20 Oct 2026 in
      research/historical-events/2026-10-20_map_tile_and_setup_audit.md with
      the exact tile, the province and the precision for every one of the six
      places, plus the homonym audit (changan was already separated from
      jingzhao on 17 Oct; yangzhou_shaanxi and guangling in yuzhou_shanxi
      remain). Tile renames are postponed as the task allows, and the
      distances are written into the note.
    acceptance: Verify filename uniqueness and document distances in records; postpone tile renames. Met on 20 Oct 2026, the six identifications and the homonym audit are documented; renames postponed.
  historical_events_and_culture_transition:
    period_id: ancient
    priority: 1
    state: in_progress
    targets: [research/historical-events/README.md, research/historical-events/2026-10-17_egypt_culture_transition.yml, research/historical-events/2026-10-17_egypt_event_design.md, research/historical-events/2026-10-17_gaul_culture_transition.yml]
    source_refs: [wiki_islamization_egypt, wiki_coptic_language, tacitus_annales_claudius, caracalla_constitutio_antoniniana, caesar_de_bello_gallico]
    question: Which region pilots the historical events and culture transition layer, and are intermediate identities (e.g. gallo_roman) needed between the 58 CE cultures and the modern keys?
    evidence: >-
      The 58 CE start leaves large ancient culture blocs (roman, germanic, slavic,
      gallian, ancient_greek, old_egyptian) while modern identities carry almost no
      pops; the engine only assimilates pops toward the owner's primary culture and
      never splits cultures on its own, so historical differentiation requires a
      script layer. The plan at research/historical-events/README.md records verified
      EU5 1.3.x tools (change_pop_culture, change_pop_religion, form_new_culture,
      merge_culture_group, change_language, add_migration) and phases the work
      data-first; the mod has no events or on_action layer yet. Maintainers confirmed
      Gaul (Galya) as the Phase 1 pilot region with gallo_roman intermediate identity.
      The 2026-10-17 working session selected Mısır (Egypt) as the pilot region and
      collected sourced transition records for the Egyptian chain (old_egyptian ->
      coptic_culture -> lower/upper egyptian, plus kushite -> nubian) in
      historical-events/2026-10-17_egypt_culture_transition.yml; the culture graph gaps
      for old_egyptian, kushite and gallian were fixed in the mod the same day. The
      Mısır pilot needs no new culture keys.
      RESOLVED (2026-10-17): the two decisions run as parallel Phase 1 tracks — Mısır
      (Egypt: records and WS3 fixes collected, design note published in
      historical-events/2026-10-17_egypt_event_design.md; five-event chain planned via
      tag-agnostic yearly on_action pulse) and Gaul (Galya: gallo_roman intermediate identity,
      sourced records collected in historical-events/2026-10-17_gaul_culture_transition.yml,
      gallo_roman defined in mod, and pilot events et_culture.101 to et_culture.103
      implemented with English and Turkish localization). Neither track blocks the other.
      UPDATE (2026-10-17, Egypt track): the Egyptian chain is now implemented in the mod -
      et_culture.1 to et_culture.5 in in_game/events/et_culture_events.txt, fired by
      et_egypt_yearly_pulse in the new file in_game/common/on_action/et_history_pulses.txt
      (vanilla yearly_country_pulse hook; owner-agnostic, one-shot per country via
      variables), with English and Turkish localization; the et_culture.9000 test event
      stays until in-game validation. The numbering agreement is realized: the Gaul pilot
      was renumbered to et_culture.101-103, leaving .1-.49 to Egypt (.100-.149 Gaul).
      TEST A PASSED (2026-10-17): the template event et_culture.9000 and the Gaul event
      et_culture.101 both fired in a live 58 CE start, and the session's error.log holds
      no mod-related line. Test B (chain) uses the verified EU5 console protocol
      (event, test_event_trigger, event_probabilities, change_date, tick_day) instead of
      temporary 58.x windows; protocol recorded in the design note, section 5.
      UPDATE 2 (2026-10-17, Egypt track): Samet's review commit f3d304d aligned the
      chain with the spec (event .2 resistance 0.05->0.15; event .3 window to
      650-1100) and materialized the Egyptian end-state keys inside the mod
      (coptic/lower/upper egyptian cultures in et_egypt.txt; coptic/arabic
      languages in 00_et_african.txt; miaphysite in et_christianity.txt) using the
      mod's established implicit-override pattern (the mod never uses REPLACE:;
      filenames sort after vanilla). Possible content loss in the vanilla-owned
      definitions (arabic dialect block referenced by ~30 vanilla cultures and by
      the mod's own et_muslim islam religion; character name pools; culture
      opinions/goods_demand_modifier; miaphysite autocephaly features) and the .5
      upper-Egypt resistance sync (spec 0.15 vs script 0.25) are flagged as
      maintainer confirmations in the design note, section 7 (items 7-8). Test B
      remains the next step.
      UPDATE 3 (2026-10-17, Egypt track): second review applied the ownership
      decision - vanilla-shadowing copies without a real delta were removed
      (arabic_language, coptic_language, lower/upper egyptian cultures, miaphysite's
      simplified version), restoring the vanilla definitions intact (seven Arabic
      dialects, character name pools, culture opinions/goods_demand_modifier,
      miaphysite autocephaly/canonization/religious_aspects); the two real deltas
      stay as verbatim vanilla plus delta (coptic_culture + arabic_group; miaphysite
      + language = coptic_language); the .5 upper-Egypt resistance returns to the
      spec value 0.15. Invalid gfx tags from the removed blocks dropped with them;
      the remainder stays in invalid_culture_gfx_tags. Test B remains the next step.
      UPDATE 4 (2026-10-17, Gaul-side review): Samet's e271902 (french_group and
      latin_language additions for the Gaul pilot) was reviewed under the same
      ownership rule. The empty latin_language copy in 00_et_celtic.txt would
      shadow the vanilla definition (00_italy.txt: Latin name pools, romance
      family, greek fallback and the roman/church dialects referenced elsewhere)
      and was removed so the vanilla definition loads; the french_group addition
      in et_culture_groups.txt is a harmless duplicate (vanilla's french_group
      body is empty too) and was left in place. The recurring mod-internal
      key-closure pattern now has a dedicated task, vanilla_key_shadow_review.
      UPDATE 5 (2026-10-17, Gaul Phase 2/3 review): Samet's 7992971 and a1988dd
      were reviewed against vanilla data. Confirmed good: dynamic_historical_event,
      has_or_had_tag, fire_only_once, historical_option, owns = location:X,
      location = location:X and pop_type filters are vanilla patterns, all named
      location keys exist in the map data, and the new burgundian/visigoth cultures
      plus central_german_dialect/gothic_language references are valid. The
      et_christianity.txt rebase conflict was resolved by keeping the
      vanilla-verbatim miaphysite block (Egypt review) and dropping the added
      catholicism block. Four defect classes were fixed in the follow-up commit:
      religion:catholicism -> religion:catholic (no such key in vanilla; the custom
      block created a parallel stripped faith without papacy/reform mechanics while
      the design record itself reads "Chalcedonian Catholicism"); location:geneva
      -> location:geneve (the real key; the extra geneva location_templates line
      was dead data and was removed); add_migration (vanilla parameters are
      owner/from/to/amount/months) replaced with add_pop settlement for the three
      migrant peoples (size 2 per location); prestige_major_bonus ->
      prestige_extreme_bonus and -prestige_mild_bonus -> prestige_mild_penalty
      (valid constants, default_values.txt); plus the et_culture.101.desc
      "chieftainers" typo reverted to "chieftains". The Gaul Phase 2/3 design
      records (christianization, Clovis) are still marked pending and the
      Rhine-crossing event has no record yet - record upkeep stays with the Gaul
      track; the new script_token_audit task covers the remaining scripts.
      UPDATE 6 (2026-10-18, Gaul Phase 4/5/6 review): the Gaul Phases 4-6 chain
      (et_culture.111-118; Phases 4 and 5 pushed as 2ca31cc and f980839, Phase 6
      still local) was reviewed line by line against vanilla data and five defect
      classes were fixed. (1) Six invalid prestige negations
      (add_prestige = -prestige_mild_bonus / -prestige_mild_penalty): named
      constants cannot be negated (default_values.txt defines the values and
      vanilla only writes add_prestige = -<number>), so all six became
      add_prestige = prestige_mild_penalty. (2) Events .112 and .116 used
      change_language on pop scope with a language: argument; vanilla
      (000_johan_debug.txt:233, flavor_NAV.txt:216) shows change_language is a
      culture-scope effect taking dialect:<key>, so both now use
      culture:<key> = { change_language = dialect:french_language } and the
      tooltips were aligned. (3) et_french.txt shadowed the vanilla-owned french,
      arpitan and norman cultures (common/cultures/french.txt defines all three)
      with stripped copies that also referenced the non-existent
      arpitan_language / norman_language keys; the three blocks were removed so
      the vanilla definitions load, and only the new occitan key remains.
      (4) occitan carried the undefined southern_european_gfx tag, replaced with
      the vanilla occitan_gfx tag set. (5) Turkish localization grammar/typos
      fixed (.113.a, .115.desc, .116.desc kanziye->kançılaryası, .118.desc,
      .118.historical_info, .112.tt). Residual pre-existing issues found while
      reviewing et_french.txt are left for the audit tasks: the aquitanian
      culture uses the undefined iberian_gfx tag, and the french_* colonial
      cultures use the malformed color = color = rgb {...} (filed under
      invalid_culture_gfx_tags and script_token_audit).
      UPDATE 7 (2026-10-18, Gaul Phase 7/8): the closing Gaul phases
      (et_culture.119-122, Modern & Contemporary France 1837-2026) were added
      data-first: four sourced records (gaul_jules_ferry_modern_unification_1881
      updated to applied; gaul_laicite_separation_1905;
      gaul_great_war_union_sacree_1914_1918;
      gaul_language_of_the_republic_1992_2008) plus four new sources in
      sources.yml (wiki_jules_ferry_laws, wiki_separation_church_state_1905,
      wiki_sacred_union, wiki_languages_of_france), each verified as a live
      en.wikipedia article. The Gaul chain now runs to MS 2026: the Ferry laws
      shift half of the remaining Breton-speaking population to french via
