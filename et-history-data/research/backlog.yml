    acceptance: Audit every reference first; retain stable IDs or publish a complete alias/migration list.
  armenia_war_and_succession:
    period_id: ancient
    priority: 1
    state: pending
    targets: [wars/firstromanparthianwar.txt, countries/ARM - Armenia.yml]
    source_refs: [iranica_armenia, iranica_vologases]
    question: Which dates and war phases are supported for Corbulo's campaign and Tigranes' appointment?
    evidence: >-
      The source places the campaign in spring 58 and Tigranocerta's surrender
      in spring 59. Existing data uses 58.2.1 for the war and 58.7.1 for the
      ruler change. These exact days have not been verified. Tigranes numbering
      differs between scholarly accounts.
    acceptance: Preserve year/season uncertainty and avoid forcing a precise game day without a documented conversion policy.
