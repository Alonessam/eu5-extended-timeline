  eic_company_names:
    entity: English East India Company
    subject: organization_identity_over_time
    finding: >-
      The chartered corporation changed its name and legal form three times: the
      charter of 31 December 1600 named The Governor and Company of Merchants
      of London Trading into the East Indies; in 1698 a New Company was
      chartered in opposition to the Old Company and adopted the name The
      English Company trading to the East Indies; in 1709 the two companies were
      amalgamated into The United Company of Merchants of England trading to
      the East Indies; the name East India Company was officially adopted only
      after the Charter Act of 1833 ended the commercial activities.
    population: "not a population finding; a corporate identity sequence"
    dating: {precision: year, year: 1600}
    mechanism: "charter, amalgamation and statutory renaming recorded in the archival administrative history"
    source_refs: [{id: bl_eic, locator: "Administrative Context, the 1698 and 1709 names and the Charter Act of 1833"}]
