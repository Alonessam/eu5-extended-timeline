  eic_court_structure:
    entity: English East India Company
    subject: organization_structure
    finding: >-
      The Old, New and United Companies operated with similar administrative
      structures: a body of proprietors (stockholders) elected an executive
      body, the Court, of 24 directors. The directors' meetings were known as
      Courts of Committees until April 1699, after which a committee in that
      sense was an individual director to whom day to day management was
      committed, jointly with the Governor and 23 others. The minutes run on
      an April to April administrative year, the General Court of Proprietors
      minutes sit in the same volumes up to April 1833 and in a separate series
      afterwards, and the series ends in 1858 when the executive functions
      passed to a Secretary of State for India through the newly created India
      Office.
    population: "not a population finding; the corporate governance structure"
    dating: {precision: year, year: 1600}
    mechanism: "proprietors electing a Court of Directors, with a General Court of Proprietors"
    source_refs: [{id: bl_eic, locator: "Administrative Context and Scope and Content, the Court of 24 directors, the April to April year, the 1833 and 1858 breaks"}]
    confidence: high
    integration: {status: applied, target: research/early_modern/2026-10-13_eic.yml, note: "The organizational representation is recorded as a finding: a chartered corporation with a Court of Directors and a General Court of Proprietors, ending in 1858 with the India Office. The record is not turned into a state, a country tag or a territorial change."}
