 et_culture.9000.title: "Extended Timeline: Şablon Testi"
 et_culture.9000.desc: "Bu, Extended Timeline kültür dönüşümü katmanının (namespace et_culture) şablon test olayıdır. Bunu görebiliyorsanız olay dosyası yükleniyor ve dinamik tarihsel olay penceresi çalışıyor demektir. Mısır pilot zinciriyle değiştirilecektir."
 et_culture.9000.a: "Anlaşıldı."
 et_culture.9000.historical_info: "WS4 olay iskeletini doğrulamak için 17 Ekim 2026'da eklenen test altyapısı; bkz. et-history-data/research/historical-events/README.md."

 et_culture.1.title: "Nil'de Yeni Bir Şafak"
 et_culture.1.desc: "Yeni inanç, İskenderiye'den yukarı Nil'e doğru kuşaklar boyunca yayıldı: limanlardan çöl manastırlarına, vadi köylerine kadar. Eski tapınaklar hâlâ ayakta, ama sunaklarına her yıl daha az insan geliyor. Devlet Mısır'ın bu sessiz dönüşümüne nasıl karşılık verecek?"
 et_culture.1.historical_info: "Hristiyanlık Mısır'a 1. yüzyılda ulaştı; İskenderiye en erken Hristiyan merkezlerindendi. 2.-4. yüzyıllardaki büyüme, zulüm dönemleri ve Konstantin sonrası dönüş, Mısırlıları 4.-5. yüzyılda büyük ölçüde Hristiyan yaptı. Kaynak kayıt: egypt_christianization_rise (wiki_christianity_egypt, wiki_coptic_language)."
 et_culture.1.a: "İnancın yayılmasına izin ver."
 et_culture.1.a.tt: "Aşağı ve Yukarı Mısır'daki Eski Mısırlı nüfusun bir kısmı Miafizit Hristiyanlığa geçer."
 et_culture.1.b: "Eski kültlere itibar et."
 et_culture.1.b.tt: "Yalnızca küçük bir kesim geçer; dönüşüm burada durur."
 et_culture.2.title: "Kıptî Kimliği"
 et_culture.2.desc: "Vadinin eski dili artık Yunan harfleri ve Hristiyan bir ruh taşıyor: keşişler ve kâtipler onunla yazıyor, Mısırlılar kendilerine Kopt demeye başladı. Demotik yazı soluyor; eski tanrılar da onunla birlikte kayboluyor. Bu yeni kimlik yerleşecek mi?"
 et_culture.2.historical_info: "Koptça, Mısır dilinin son evresidir (Eski Koptça 1. yy; edebî Koptça 3. yy); değişim nüfus değişimi değil, aynı halkın yazı ve din eksenindeki kimlik dönüşümüdür. 451 Kadıköy Konsili, Kopt (Miafizit) kilisesi ile Yunanca konuşan Melkitler arasındaki sınırı keskinleştirdi. Kaynak kayıtlar: egypt_coptic_emergence_and_continuity, egypt_chalcedon_split_451."
 et_culture.2.a: "Tek halk, tek ad: Koptlar."
 et_culture.2.a.tt: "Kalan putperest topluluklar büyük ölçüde şehirleri izleyerek Hristiyanlaşır ve Hristiyanlaşan Mısırlılar Kopt kimliğini benimser."
 et_culture.2.b: "Eski adlar korunsun."
 et_culture.2.b.tt: "Yalnızca küçük bir kesim geçer; kimlik dönüşümü yaşanmaz."
 et_culture.3.title: "Zimmi Yılları"
 et_culture.3.desc: "Nil'e yeni efendiler hükmediyor: garnizon şehirleri, vergi defterleri ve divan artık Arapça konuşuyor; korunmuş halklar cizyelerini ödüyor. Dönüşüm yavaş ama gerçek: daha iyi bir mevki, daha hafif bir yük, bir cemaatten çıkıp diğerine atılan bir adım. Bu adımı kim atacak?"
 et_culture.3.historical_info: "Râşidûn fethi (639-642) halkı değil yönetimi ve hukuki statüyü değiştirdi; Mısır yüzyıllarca çoğunlukla Hristiyan kaldı. Başlangıçta yavaş olan ihtida, 8.-9. yüzyılların mali baskılarıyla hızlandı. Kaynak kayıt: egypt_islamization_waves (wiki_islamization_egypt); bağlam: egypt_arab_conquest_639_642, egypt_arabic_administration_700."
 et_culture.3.a: "Yavaş dalga kendi seyrini izlesin."
 et_culture.3.a.tt: "Aşağı ve Yukarı Mısır'daki Müslüman olmayan nüfusun bir kısmı İslam'a geçer."
 et_culture.3.b: "Eski kiliseyi koru."
 et_culture.3.b.tt: "Yalnızca küçük bir kesim geçer; dalga burada durur."
 et_culture.4.title: "Ona Bir"
 et_culture.4.desc: "Fâtımî ihtişamının ve Memlûk kılıcının gölgesinde denge geri dönüşsüz biçimde değişti: vadide kalan her Hristiyana karşılık on Müslüman toprağı işliyor ve şehirleri yönetiyor. Kopt haçı eski mabetlerin üzerinde hâlâ yükseliyor; ama artık başka bir ülkenin topraklarında duruyor."
 et_culture.4.historical_info: "İhtida Fâtımî döneminden itibaren hızlandı ve 14. yüzyılda büyük bir Memlûk dalgasıyla doruğa ulaştı; Memlûk döneminin sonunda Müslüman-Hristiyan oranı yaklaşık ona bir olarak tahmin edilir; Koptlar giderek daha çok Yukarı Mısır'da toplandı. Kaynak kayıt: egypt_islamization_waves (wiki_islamization_egypt)."
 et_culture.4.a: "Vadi inancını değiştirdi."
 et_culture.4.a.tt: "Kalan Müslüman olmayan nüfusun büyük bir kısmı İslam'a geçer."
 et_culture.4.b: "Kilise dayanır."
 et_culture.4.b.tt: "Yalnızca küçük bir kesim geçer; dalga sınırlı kalır."
 et_culture.5.title: "Dilin Sessiz Değişimi"
 et_culture.5.desc: "Şehirlerde eski dil çoktan gitti; köylerde birkaç kuşak daha direniyor. Kahire ve Asyut pazarlarında konuşulan artık Arapça; vadinin Müslümanları, Hristiyan komşularının yalnızca ayinlerde sakladığı adları ve sözcükleri taşıyor."
 et_culture.5.historical_info: "Koptça 10.-12. yüzyıla kadar halkın çoğunluğunun konuştuğu dil olarak kaldı; Hâkim döneminden itibaren hızla geriledi ve 11.-12. yüzyıllarda edebî dil olmaktan çıktı; sonrasında bir azınlık ve ayin dili olarak yaşadı. Kopt nüfus Arapça konuşan Aşağı/Yukarı Mısır kimliklerine kayar; Kopt azınlığı varlığını sürdürür. Kaynak kayıt: egypt_coptic_spoken_decline (wiki_coptic_language)."
 et_culture.5.a: "Vadi artık Arapça konuşuyor."
 et_culture.5.a.tt: "Aşağı ve Yukarı Mısır'daki Müslüman nüfus Arapça konuşan Mısır kimliklerini benimser; Hristiyan azınlık Kopt kimliğini korur."
 et_culture.5.b: "Eski dile tutun."
 et_culture.5.b.tt: "Yalnızca küçük bir kesim kayar; eski dil köylerde varlığını sürdürür."

 et_culture.101.title: "Lugdunum'da Galya Meclisi"
 et_culture.101.desc: "Roma Barışı'nın himayesinde, Üç Galya'nın tüm kabile şefleri ve ileri gelenleri Lugdunum'daki (Lyon) Roma ve Augustus Sunağı önünde toplandı. Tanrılaştırılmış İmparator Claudius'un açtığı yoldan yürüyen Galya soyluları, Roma Senatosu'na ve imparatorluk magistralıklarına kabul edilmeyi talep ediyor. Toga giyen, Latin dilini ve Roma hukukunu benimseyen bu yerel aristokrasi, Kelt mirası ile Roma medeniyeti arasında sağlam bir köprü kurmaktadır."
 et_culture.101.a: "Galya soylularını Roma nizamına kabul et."
 et_culture.101.b: "Taşralıları mesafede tut."
 et_culture.101.historical_info: "MS 48 yılında İmparator Claudius, Roma Senatosu'nda yaptığı tarihi konuşmayla (Lyon Bronz Tableti / Tabula Claudiana) Galya kabile şeflerine senatör olma hakkı tanıdı. Lugdunum'da her yıl toplanan Galya Meclisi (Concilium Galliarum), Gallo-Romen kimliğinin doğuşuna öncülük etti."
 et_culture.101.tt: "Büyük eyalet merkezlerindeki Galya soyluları ve şehirlileri Gallo-Romen kültürünü benimser."

 et_culture.102.title: "Galya Eyaletlerinde Roma-Kelt Senkretizmi"
 et_culture.102.desc: "Taş döşeli Roma yolları boyunca ve kırsal villa yerleşkelerinde, Galya'nın kadim inançları Roma panteonuyla kaynaşmaya başladı. Sen nehrinden Pireneler'e kadar tapınaklarda Lugus, Merkür ile birlikte; Toutatis, Mars ile yan yana anılıyor; süvari kışlalarında Epona'ya adaklar sunuluyor. Halk Latincesi ve Galya-Roma hayat tarzı, kırsaldaki çiftçilerin ve zanaatkarların günlük yaşamına tamamen yerleşti."
 et_culture.102.a: "Senkretik ibadeti ve eyalet entegrasyonunu teşvik et."
 et_culture.102.b: "Geleneksel Roma kültlerini katı biçimde uygula."
 et_culture.102.historical_info: "MS 2. yüzyılda Pax Romana (Roma Barışı) altında Kelt tanrıları Roma panteonuna uyarlandı (Interpretatio Romana). Villa ekonomisi ve yol ağları sayesinde Galya-Roma maddi kültürü kırsal köylülüğe yayıldı."
 et_culture.102.tt: "Galya zanaatkarları ve kırsal nüfusu Gallo-Romen kültürüne geçer."

 et_culture.103.title: "Caracalla Fermanı: Evrensel Yurttaşlık"
 et_culture.103.desc: "İmparator Caracalla'nın fermanı (Constitutio Antoniniana) ile imparatorluğun tüm eyaletlerindeki hür erkeklere tam Roma vatandaşlığı hakkı bahşedildi. Fatih ile eyaletli arasındaki hukuki ayrım tamamen ortadan kalktı. Galya'nın şehirlerinden köylerine kadar her hür fert, artık Roma hukukunun koruması altında eşit bir Roma vatandaşıdır."
 et_culture.103.a: "Tüm hür Galyalılar artık Roma vatandaşıdır."
 et_culture.103.b: "Vatandaşlığı yalnızca seçkinlere sakla."
 et_culture.103.historical_info: "MS 212 yılında İmparator Caracalla tarafından ilan edilen ferman (Constitutio Antoniniana), imparatorluk sınırları içindeki tüm özgür halklara Roma vatandaşlığı vererek eyaletlerin hukuki ve kültürel bütünleşmesini tamamladı."
 et_culture.103.tt: "İmparatorluktaki kalan Galya nüfusunun büyük bölümü Roma vatandaşlığını ve Gallo-Romen kimliğini benimser."

 et_culture.104.title: "Galya İmparatorluğu"
 et_culture.104.desc: "Roma'nın merkezi otoritesi barbar istilaları ve askeri anarşi altında çökerken, Batavia kökenli general Postumus, Galya, Britanya ve Hispanya'yı kapsayan ayrı bir Galya İmparatorluğu ilan etti. Gallo-Romen elitler Ren sınırında Roma medeniyetini korumak için ona katıldı. Roma bu ayrı devleti tanıyacak mı?"
 et_culture.104.a: "Galya eyaletleri savunulmalı."
 et_culture.104.b: "İsyankar valilerin meşruiyeti yoktur."
 et_culture.104.historical_info: "MS 260–274 arasında Postumus ve halefleri, Üçüncü Yüzyıl Krizi sırasında Galya, Britanya ve Hispanya'yı kapsayan Imperium Galliarum'u yönettiler. İmparatorluk, Aurelian'ın Tetricus'u Châlons'da yenmesiyle sona erdi."
 et_culture.104.tt: "Ayrılıkçı eyaletlerdeki Gallo-Romen elitler, Gallo-Romen kimliğini benimser."

 et_culture.105.title: "Lugdunum Şehitleri"
 et_culture.105.desc: "Lugdunum amfiatrosunda, genç köle kız Blandina ve yaşlı piskopos Pothinus, inançları için ölen ilk Galyalılar arasında. Kanları Lyon kilisesinin tohumunu eker ve nesiller içinde Galya'nın şehirleri yeni inançın kalesine dönüşür. Şehirler öncülenir; kırsal yavaş yavaş izler."
 et_culture.105.a: "Şehitleri onurlandır; inancın yayılmasına izin ver."
 et_culture.105.b: "Eski tanrılar terk edilmemeli."
 et_culture.105.historical_info: "Lugdunum Şehitleri (MS 177), Blandina ve Pothinus dahil, Galya'da belgelenmiş ilk Hristiyan şehitler arasındaydı. Tanıkları Lyon piskoposluğunun kurulmasını ve Galo-Romen şehirlerinin kademeli olarak Hristiyanlaşmasını sağladı."
 et_culture.105.tt: "Büyük Galya şehirlerindeki kentsel nüfus, Kadıköy (Halkedon) Hristiyanlığına geçer."

 et_culture.106.title: "Galya Köylüsünün Elçisi"
 et_culture.106.desc: "Tours piskoposu Martin, eski Roma askerliğinden köylü nüfusunun arasına dönerek kutsal korulardan, pagan kutsal pınarlarından ve kırsal tapınaklarından kurtulup yerlerine kiliseler ve manastırlar kuruyor. Kırsal Galya dünyası İmparator'un fermanıyla değil, gezgin bir piskoposun özgür iradesiyle yavaşça Hristiyanlığa dönüyor."
 et_culture.106.a: "Martin'ın köylüler arasındaki misyonunu kutsa."
 et_culture.106.b: "Geleneksel yaşam korunmalı."
 et_culture.106.historical_info: "Tourslu Aziz Martin (316–397), eski bir Roma askeri Tours piskoposu olarak kırsal Galya nüfusunu sistematik olarak Hristiyanlaştıran; tapınakları yıkıp, kırsal alanlara kilise ve manastırlar kuran bir figürdü."
 et_culture.106.tt: "Galya eyaletlerinin kırsal nüfusu, Kadıköy (Halkedon) Hristiyanlığına geçer."

 et_culture.107.title: "Armorika Yerleşmeleri"
 et_culture.107.desc: "Sakson ve Anglosakson istilalarından kaçan Britanyalılar, adalarını terk edip Armorika Yarımadası'na geçiyor. Dilini, kutsal kahramanlarını ve geleneklerini getirip bölgeyi Bretonya olarak yeniden adlandırıyor. Roma nizamı çöküyor ama Kelt ruhu direniyor."
 et_culture.107.a: "Britanya mültecilerini Armorika'ya kabul et."
 et_culture.107.b: "Yarımadanın Gallo-Romen kalması gerekir."
 et_culture.107.historical_info: "MS 4. ve 6. yüzyıllar arasında, Anglosakson istilalarından kaçan Britanyalılar, Armorika'ya göç ederek, Galya'nın kuzeybatısında Kelt dilini ve kültürünü koruyan bölgeyi (Bretanya / Breizh) oluşturdu."
 et_culture.107.tt: "Armorika'nın nüfusu, Breton kültürüne geçer."

 et_culture.108.title: "Ren Geçidi"
 et_culture.108.desc: "406 yılının son gecesi, donmuş Ren Vandallar, Alanlar ve Süevlerin kitlesi önünde çöküyor. Sınır çözülüyor. Burgundlar Yukarı Ren'e yerleşiyor, Vizigotlar Akdeniz'e, Vandallar güneye doğru ilerliyor. Galya'daki Roma nizamı Cermen halkları kendi anavatanlarını kurarken parçalanıyor."
 et_culture.108.a: "Sınır kırıldı; halklar hareket ediyor."
 et_culture.108.b: "Roma Ren'i koruyacak."
 et_culture.108.historical_info: "MS 406 yılının 31 Aralık gecesi, Vandallar, Alanlar ve Süevler donmuş Ren'i geçerek Ren sınırını çöktü. Burgundlar Yukarı Ren'e (413), Vizigotlar Akdeniz'e (418), Vandallar Hispanya'ya doğru ilerledi."
 et_culture.108.tt: "Burgund, Vizigot ve Vandall göçleri Galya eyaletlerine giriyor."

 et_culture.109.title: "Galya'nın Son Romalısı"
 et_culture.109.desc: "Aegidius'un oğlu Syagrius, Soissons çevresindeki son Roma topraklarını koruyor — Frenklerin "Romalıların Krallığı" dediği yer. Clovis 486'da Soissons'da onu yendiğinde, Roma Galya'sı sona eriyor. Frenk çağı başlıyor."
 et_culture.109.a: "Galya'daki Roma nizamı sona erdi."
 et_culture.109.b: "Soissons düşmemeli."
 et_culture.109.historical_info: "Syagrius, Aegidius'un oğlu, Clovis'in 486'da Soissons Savaşı'nda yenmesine kadar Soissons çevresindeki son Roma devleti (464–486) yönetti. Bu, Galya'da Roma yönetiminin sona erdiği ve Frenk hâkimiyetinin başladığı anlamına gelir."
 et_culture.109.tt: "Kuzey şehirlerindeki Gallo-Romen nüfus, Frenk kültürüne geçer."

 et_culture.110.title: "Clovis'in Vaftizi"
 et_culture.110.desc: "Frenk kralı Clovis, Reims piskoposu Remigius'un elinden vaftiz oluyor. Aryanist Cermen krallarından farklı olarak, Gallo-Roman çoğunluğunun Katolik inancına kabul ediliyor. Frenk ve Gallo-Roman halkları tek bir Hristiyan millette kaynaşıyor."
 et_culture.110.a: "Frenkler ve Gallo-Romenler tek halk oluyor."
 et_culture.110.b: "Frenkler atalara ait geleneklerini korusun."
 et_culture.110.historical_info: "Salian Frenkleri'nin kralı I. Clovis, Reims Piskoposu Remigius tarafından vaftiz edildi (selenek 496 veya 508). Diğer Cermen yöneticilerin Aryanizminden farklı olarak, Katolik Hristiyanlığı benimsemesi Frenk ile Gallo-Roman nüfusunu kaynaştırdı."
 et_culture.110.tt: "Frenk ve Gallo-Roman nüfusu Katolikliği benimser."

 et_culture.111.title: "Galya'nın İki Dili"
 et_culture.111.desc: "Kuzeyde, Gallo-Roman dili Frenk etkisi altında oïl diline — modern Fransızcanın atasına — dönüşmüş. Güneyde, Gallo-Roman konuşması oc dili olarak Latincede daha yakın bir süreklilikle varlığını sürdürüyor. Alp cephelerinde ise üçüncü bir dil — Arpitan — iki tarafı birbirine bağlıyor. Galya artık tek dilli tek halk değil."
 et_culture.111.a: "Diller ayrılsın."
 et_culture.111.b: "Tek Galya, tek dil."
 et_culture.111.historical_info: "MS 7. ve 9. yüzyıllar arasında Gallo-Roman konuşması ayrıştı: Frenk etkisi altındaki kuzey langue d'oïl (Fransızcanın atası), Latincede daha yakın sürekliliği koruyan güney langue d'oc (Oksitanca) ve Alp cephelerinde Arpitan. Strazburg Yeminleri (842), Latinceden ayrı bir Roman lehçesinin ilk yazılı belgesidir."
 et_culture.111.tt: "Kuzey Galya Fransızca'ya, güney Galya Oksitanca'ya ve Alp cepheleri Arpitan'a geçer."

 et_culture.112.title: "Halk Dilinde Kelam"
 et_culture.112.desc: "Tours Konsili (813), halkın Latinceyi artık anlamadığını kabul edip vaazların halkın dili — rustica romana — ile verilmesini emreder. 842'de Strazburg Yeminleri ilk yazılı Fransızca metin olarak tarihe geçer. Kilise, Fransızcanın doğum ebeveyni olur."
 et_culture.112.a: "Kelam halkın diliyle söylensin."
 et_culture.112.b: "Latin Tanrı'nın dilidir."
 et_culture.112.historical_info: "Tours Konsili (813), vaazların halkın anladığı Roman lehçesinde verilmesini zorunlu kıldı. Strazburg Yeminleri (842), Latinceden ayrı bir Roman lehçesinin ilk yazılı belgesi olarak Fransızcanın edebî dil olarak doğuşunu işaretler."
 et_culture.112.tt: "Gallo-Roman, Fransız, Oksitan ve Arpitan nüfusu Fransızca dilini benimser."

 et_culture.113.title: "Normandiya'dan Kuzeyliler"
 et_culture.113.desc: "Saint-Clair-sur-Epte Antlaşması (911) ile Viking lideri Rollo, Kral Basit Charles önünde diz çöküyor ve Normandiya olacak toprakları alıyor. İki nesil içinde Kuzeyliler Fransızca konuşuyor, Hristiyan oluyor ve Frenk krallığının en savaşçı askerlerine dönüşüyor."
 et_culture.113.a: "Kuzeylilerinlerine ayrıcalıklı toprak ver."
 et_culture.113.b: "Deniz kurtlarına güvenilmez."
 et_culture.113.historical_info: "Saint-Clair-sur-Epte Antlaşması (911), Viking lideri Rollo'ya Normandiya olacak toprakları verdi. İki nesil içinde Normanlar Fransızca dilini ve Katolik inancını benimsedi; savaşçılık yeteneklerini korudular."
 et_culture.113.tt: "Caen, Cherbourg, Bayeux ve Rouen'da Norman yerleşmeleri ortaya çıkar."
