 et_culture.9000.title: "Extended Timeline: Şablon Testi"
 et_culture.9000.desc: "Bu, Extended Timeline kültür dönüşümü katmanının (namespace et_culture) şablon test olayıdır. Bunu görebiliyorsanız olay dosyası yükleniyor ve dinamik tarihsel olay penceresi çalışıyor demektir. Mısır pilot zinciriyle değiştirilecektir."
 et_culture.9000.a: "Anlaşıldı."
 et_culture.9000.historical_info: "WS4 olay iskeletini doğrulamak için 17 Ekim 2026'da eklenen test altyapısı; bkz. et-history-data/research/historical-events/README.md."

 et_culture.1.title: "Lugdunum'da Galya Meclisi"
 et_culture.1.desc: "Roma Barışı'nın himayesinde, Üç Galya'nın tüm kabile şefleri ve ileri gelenleri Lugdunum'daki (Lyon) Roma ve Augustus Sunağı önünde toplandı. Tanrılaştırılmış İmparator Claudius'un açtığı yoldan yürüyen Galya soyluları, Roma Senatosu'na ve imparatorluk magistralıklarına kabul edilmeyi talep ediyor. Toga giyen, Latin dilini ve Roma hukukunu benimseyen bu yerel aristokrasi, Kelt mirası ile Roma medeniyeti arasında sağlam bir köprü kurmaktadır."
 et_culture.1.a: "Galya soylularını Roma nizamına kabul et."
 et_culture.1.b: "Taşralıları mesafede tut."
 et_culture.1.historical_info: "MS 48 yılında İmparator Claudius, Roma Senatosu'nda yaptığı tarihi konuşmayla (Lyon Bronz Tableti / Tabula Claudiana) Galya kabile şeflerine senatör olma hakkı tanıdı. Lugdunum'da her yıl toplanan Galya Meclisi (Concilium Galliarum), Gallo-Romen kimliğinin doğuşuna öncülük etti."
 et_culture.1.tt: "Büyük eyalet merkezlerindeki Galya soyluları ve şehirlileri Gallo-Romen kültürünü benimser."

 et_culture.2.title: "Galya Eyaletlerinde Roma-Kelt Senkretizmi"
 et_culture.2.desc: "Taş döşeli Roma yolları boyunca ve kırsal villa yerleşkelerinde, Galya'nın kadim inançları Roma panteonuyla kaynaşmaya başladı. Sen nehrinden Pireneler'e kadar tapınaklarda Lugus, Merkür ile birlikte; Toutatis, Mars ile yan yana anılıyor; süvari kışlalarında Epona'ya adaklar sunuluyor. Halk Latincesi ve Galya-Roma hayat tarzı, kırsaldaki çiftçilerin ve zanaatkarların günlük yaşamına tamamen yerleşti."
 et_culture.2.a: "Senkretik ibadeti ve eyalet entegrasyonunu teşvik et."
 et_culture.2.b: "Geleneksel Roma kültlerini katı biçimde uygula."
 et_culture.2.historical_info: "MS 2. yüzyılda Pax Romana (Roma Barışı) altında Kelt tanrıları Roma panteonuna uyarlandı (Interpretatio Romana). Villa ekonomisi ve yol ağları sayesinde Galya-Roma maddi kültürü kırsal köylülüğe yayıldı."
 et_culture.2.tt: "Galya zanaatkarları ve kırsal nüfusu Gallo-Romen kültürüne geçer."

 et_culture.3.title: "Caracalla Fermanı: Evrensel Yurttaşlık"
 et_culture.3.desc: "İmparator Caracalla'nın fermanı (Constitutio Antoniniana) ile imparatorluğun tüm eyaletlerindeki hür erkeklere tam Roma vatandaşlığı hakkı bahşedildi. Fatih ile eyaletli arasındaki hukuki ayrım tamamen ortadan kalktı. Galya'nın şehirlerinden köylerine kadar her hür fert, artık Roma hukukunun koruması altında eşit bir Roma vatandaşıdır."
 et_culture.3.a: "Tüm hür Galyalılar artık Roma vatandaşıdır."
 et_culture.3.b: "Vatandaşlığı yalnızca seçkinlere sakla."
 et_culture.3.historical_info: "MS 212 yılında İmparator Caracalla tarafından ilan edilen ferman (Constitutio Antoniniana), imparatorluk sınırları içindeki tüm özgür halklara Roma vatandaşlığı vererek eyaletlerin hukuki ve kültürel bütünleşmesini tamamladı."
 et_culture.3.tt: "İmparatorluktaki kalan Galya nüfusunun büyük bölümü Roma vatandaşlığını ve Gallo-Romen kimliğini benimser."
