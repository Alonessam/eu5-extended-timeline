 et_culture.9000.title: "Extended Timeline: Event Template Test"
 et_culture.9000.desc: "This is a template test event for the Extended Timeline culture transition layer (namespace et_culture). If you can read this, the events file loads and the dynamic historical event window fires. It will be replaced by the sourced Egypt pilot chain."
 et_culture.9000.a: "Understood."
 et_culture.9000.historical_info: "Test scaffolding added on 2026-10-17 to verify the WS4 event skeleton; see et-history-data/research/historical-events/README.md."

 et_culture.1.title: "A New Dawn on the Nile"
 et_culture.1.desc: "From Alexandria the new faith has spread upriver for generations: through the ports, the desert monasteries and the villages of the valley. The old temples still stand, but fewer come to their altars each year. How shall the state meet this quiet transformation of Egypt?"
 et_culture.1.historical_info: "Christianity reached Egypt in the 1st century; Alexandria was among the earliest Christian centres. Growth through the 2nd-4th centuries, the persecutions and the Constantinian turn made the Egyptians largely Christian by the 4th-5th century. Source record: egypt_christianization_rise (wiki_christianity_egypt, wiki_coptic_language)."
 et_culture.1.a: "Let the faith spread."
 et_culture.1.a.tt: "Part of the Old Egyptian population in Lower and Upper Egypt converts to Miaphysite Christianity."
 et_culture.1.b: "Keep the old cults favoured."
 et_culture.1.b.tt: "Only a small share converts; the transition stalls here."
 et_culture.2.title: "The Coptic Identity"
 et_culture.2.desc: "The old tongue of the valley now wears Greek letters and a Christian soul: monks and scribes write it, and the Egyptians have begun to call themselves Copts. The Demotic script fades; the old gods fade with it. Will this new identity consolidate?"
 et_culture.2.historical_info: "Coptic is the final stage of the Egyptian language (Old Coptic, 1st century; literary Coptic, 3rd century); the shift came from the same population changing script and faith, not from a replacement. The Council of Chalcedon (451) hardened the boundary between the Coptic (Miaphysite) church and the Greek-speaking Melkites. Source records: egypt_coptic_emergence_and_continuity, egypt_chalcedon_split_451."
 et_culture.2.a: "One people, one name: Copts."
 et_culture.2.a.tt: "The remaining pagan communities largely follow the towns into Christianity, and the Christianized Egyptians adopt the Coptic identity."
 et_culture.2.b: "Keep the old names."
 et_culture.2.b.tt: "Only a small share converts; the identity shift does not happen."
 et_culture.3.title: "The Years of the Dhimma"
 et_culture.3.desc: "New masters rule the Nile: the garrison cities, the tax rolls and the chancery now speak Arabic, and the Protected People pay their jizya. Conversion is slow but real: a better career, a lighter burden, one step out of one community and into another. Who will take that step?"
 et_culture.3.historical_info: "The Rashidun conquest (639-642) changed the rulers and the legal status of the people, not the people themselves: Egypt remained majority-Christian for centuries. Conversion, slow at first, quickened under the fiscal pressure of the 8th-9th centuries. Source record: egypt_islamization_waves (wiki_islamization_egypt); context: egypt_arab_conquest_639_642, egypt_arabic_administration_700."
 et_culture.3.a: "Let the slow tide run its course."
 et_culture.3.a.tt: "Part of the non-Muslim population of Lower and Upper Egypt converts to Islam."
 et_culture.3.b: "Shield the old church."
 et_culture.3.b.tt: "Only a small share converts; the wave stalls here."
 et_culture.4.title: "Ten to One"
 et_culture.4.desc: "Under Fatimid splendour and Mamluk steel the balance has tipped beyond return: for every Christian left in the valley, ten Muslims till the soil and rule the cities. The Coptic cross still rises over the old sanctuaries, but it now stands in another country's land."
 et_culture.4.historical_info: "Conversion accelerated from the Fatimid era and peaked in a large 14th-century Mamluk wave; by the end of the Mamluk period the Muslim-to-Christian ratio stood near ten to one, with Copts concentrated ever more in Upper Egypt. Source record: egypt_islamization_waves (wiki_islamization_egypt)."
 et_culture.4.a: "The valley has changed its faith."
 et_culture.4.a.tt: "A large share of the remaining non-Muslim population converts to Islam."
 et_culture.4.b: "The church endures."
 et_culture.4.b.tt: "Only a small share converts; the wave remains limited."
 et_culture.5.title: "The Quiet Language Shift"
 et_culture.5.desc: "In the towns the old tongue is already gone; in the villages it lingers a few generations more. What is spoken in the markets of Cairo and Asyut is Arabic, and the Muslims of the valley carry names and words that their Christian neighbours keep only in liturgy."
 et_culture.5.historical_info: "Coptic remained the spoken language of the majority until c. 950-1200, declined sharply from al-Hakim's reign and ceased to be literary in the 11th-12th centuries; it survives as a minority and liturgical language. The Coptic population shifts into Lower and Upper Egyptian (Arabic-speaking) identities while a Coptic minority persists. Source record: egypt_coptic_spoken_decline (wiki_coptic_language)."
 et_culture.5.a: "The valley speaks Arabic now."
 et_culture.5.a.tt: "The Muslim population of Lower and Upper Egypt adopts Arabic-speaking Egyptian identities; the Christian minority keeps the Coptic identity."
 et_culture.5.b: "Hold to the old tongue."
 et_culture.5.b.tt: "Only a small part shifts; the old language lingers in the villages."

 et_culture.101.title: "The Gallic Council at Lugdunum"
 et_culture.101.desc: "Under the authority of the imperial peace, chieftainers and dignitaries from all the nations of the Three Gauls have assembled before the Altar of Rome and Augustus at Lugdunum. Following the precedent of the deified Claudius, the aristocrats of Gallia Comata seek entry into the Roman Senate and the civic magistracies of the Empire. By adopting the Latin tongue, Roman legal customs, and the toga, the Gallic nobility forms a bridge between indigenous Celtic heritage and Roman civic civilization."
 et_culture.101.a: "Welcome the Gallic nobility into the Roman order."
 et_culture.101.b: "Keep the provincials at arm's length."
 et_culture.101.historical_info: "In 48 CE, Emperor Claudius delivered a landmark speech to the Senate (recorded on the Lyon Bronze Tablet) granting the Gallic aristocracy the right to hold imperial magistracies. The annual Concilium Galliarum at Lugdunum solidified this elite synthesis, giving birth to Gallo-Roman culture."
 et_culture.101.tt: "Gallic nobles and burghers in major provincial civitates adopt the Gallo-Roman culture."

 et_culture.102.title: "Interpretatio Romana in the Gallic Provinces"
 et_culture.102.desc: "Along the paved Roman highways and across the prosperous villa estates of the countryside, the ancient traditions of Gaul have merged with the imperial cult. In temples and shrines from the Seine to the Pyrenees, Lugus is honored beside Mercury, Toutatis alongside Mars, and Epona in the cavalry encampments. Vulgar Latin and Gallo-Roman material culture have become the daily fabric of life for artisans and farmers throughout the provinces."
 et_culture.102.a: "Encourage syncretic worship and provincial integration."
 et_culture.102.b: "Strictly enforce traditional Roman cults."
 et_culture.102.historical_info: "During the 2nd century Pax Romana, religious and linguistic syncretism spread through rural Gaul. Celtic gods were assimilated into the Roman pantheon (Interpretatio Romana), and Gallo-Roman material culture spread to the agrarian peasantry."
 et_culture.102.tt: "Gallic artisans and rural pops adopt the Gallo-Roman culture."

 et_culture.103.title: "The Edict of Caracalla: Universal Citizenship"
 et_culture.103.desc: "By imperial decree of Emperor Caracalla, the Constitutio Antoniniana grants full Roman citizenship to all free men across the provinces of the Empire. The legal distinctions between conqueror and provincial are dissolved. In the cities and villages of Gallia, every free resident is now a full citizen of Rome, bound by the universal majesty of Roman Law."
 et_culture.103.a: "All free Gauls are now citizens of Rome."
 et_culture.103.b: "Restrict citizenship to preserve patrician privilege."
 et_culture.103.historical_info: "Promulgated in 212 CE by Emperor Caracalla (Constitutio Antoniniana, P.Giss. 40), this edict granted Roman citizenship to all free inhabitants of the Roman Empire, completing the legal and cultural unification of the provinces."
 et_culture.103.tt: "Remaining Gallic populations throughout the empire receive Roman citizenship and embrace Gallo-Roman culture."

 et_culture.104.title: "The Gallic Empire"
 et_culture.104.desc: "As the central authority of Rome falters under barbarian invasions and military anarchy, Postumus, a general of Batavian origin, has declared a separate Gallic Empire encompassing Gaul, Britain, and Hispania. The Gallo-Roman elite rally behind him, seeking to preserve Roman civilization on the Rhine frontier. Will Rome acknowledge this breakaway state?"
 et_culture.104.a: "The Gallic provinces must be defended."
 et_culture.104.b: "Rebel governors have no legitimacy."
 et_culture.104.historical_info: "From 260 to 274 CE, Postumus and his successors ruled the Imperium Galliarum, a breakaway state encompassing Gaul, Britain, and Hispania during the Crisis of the Third Century. The empire fell when Aurelian defeated Tetricus at Châlons."
 et_culture.104.tt: "Gallic elites in the breakaway provinces adopt the Gallo-Roman identity."

 et_culture.105.title: "The Martyrs of Lugdunum"
 et_culture.105.desc: "In the amphitheater of Lugdunum, the young slave girl Blandina and the elderly bishop Pothinus are among the first Gauls to die for their Christian faith. Their blood seeds the church of Lyon, and within generations the urban centers of Gaul become strongholds of the new faith. The cities lead; the countryside follows slowly."
 et_culture.105.a: "Honor the martyrs; let the faith spread."
 et_culture.105.b: "The old gods must not be abandoned."
 et_culture.105.historical_info: "The Martyrs of Lugdunum (177 CE), including Blandina and Pothinus, were among the first documented Christian martyrs in Gaul. Their witness led to the establishment of the episcopal see of Lyon and the gradual Christianization of the Gallo-Roman cities."
 et_culture.105.tt: "The urban population of major Gallic cities adopts Chalcedonian Christianity."

 et_culture.106.title: "The Apostle of the Gallic Peasantry"
 et_culture.106.desc: "Martin, a former Roman soldier turned bishop of Tours, travels the countryside destroying sacred groves, pagan springs, and rustic shrines, replacing them with churches and monasteries. The rural Gallic world slowly turns from its ancestral gods to Christ, not by imperial decree but by the zeal of one wandering bishop."
 et_culture.106.a: "Bless Martin's mission among the peasants."
 et_culture.106.b: "The old ways must be preserved."
 et_culture.106.historical_info: "Saint Martin of Tours (316-397) was a former Roman soldier who became bishop of Tours and systematically evangelized the rural Gallic population, destroying pagan temples and establishing churches and monasteries throughout the countryside."
 et_culture.106.tt: "The rural population of the Gallic provinces adopts Chalcedonian Christianity."

 et_culture.107.title: "The Armorican Settlements"
 et_culture.107.desc: "Fleeing the Saxon and Anglo-Saxon invasions of their island, the Brythonic-speaking peoples of Britain cross the sea and settle the western peninsula of Armorica. They bring their language, their saints, and their customs, renaming the land Brittany. The Roman order collapses, but the Celtic spirit endures."
 et_culture.107.a: "Welcome the British refugees to Armorica."
 et_culture.107.b: "The peninsula must remain Gallo-Roman."
 et_culture.107.historical_info: "Between the 4th and 6th centuries, Brythonic-speaking Britons migrated to Armorica fleeing Anglo-Saxon invasions, establishing the region that would become Brittany (Breizh), preserving Celtic language and culture in the northwest of Gaul."
 et_culture.107.tt: "The population of Armorica adopts the Breton culture."

 et_culture.108.title: "The Rhine Crossing"
 et_culture.108.desc: "On the last night of 406, the frozen Rhine gives way before the mass of Vandals, Alans, and Suebi. The frontier collapses. Burgundians settle the upper Rhine, Visigoths move south toward Aquitaine, and Vandals push toward the Mediterranean. The Roman order in Gaul fractures as Germanic peoples carve out homelands."
 et_culture.108.a: "The frontier has broken; the peoples move."
 et_culture.108.b: "Rome will hold the Rhine."
 et_culture.108.historical_info: "On December 31, 406 CE, Vandals, Alans, and Suebi crossed the frozen Rhine, collapsing the Rhine frontier. Burgundians settled the upper Rhine (413), Visigoths moved to Aquitaine (418), and Vandals pushed south through Gaul toward Hispania."
 et_culture.108.tt: "Burgundian, Visigothic, and Vandal migrations enter the Gallic provinces."

 et_culture.109.title: "The Last Roman in Gaul"
 et_culture.109.desc: "Syagrius, son of Aegidius, holds the last Roman domain around Soissons — the 'Kingdom of the Romans' as the Franks call it. When Clovis defeats him at Soissons in 486, Roman Gaul ceases to exist. The Frankish age begins."
 et_culture.109.a: "The Roman order in Gaul has ended."
 et_culture.109.b: "Soissons must not fall."
 et_culture.109.historical_info: "Syagrius ruled the last Roman rump state around Soissons (464-486) until Clovis defeated him at the Battle of Soissons in 486, ending Roman rule in Gaul and establishing Frankish supremacy."
 et_culture.109.tt: "The Gallo-Roman population of the northern cities adopts the Frankish culture."

 et_culture.110.title: "The Baptism of Clovis"
 et_culture.110.desc: "King Clovis, leader of the Salian Franks, kneels at the font of Reims and is baptized by Bishop Remigius. Unlike the Arian Germanic kings, he embraces the Catholic faith of the Gallo-Roman masses. The Frankish and Gallo-Roman peoples fuse into one Christian nation."
 et_culture.110.a: "The Franks and Gallo-Romans become one people."
 et_culture.110.b: "The Franks keep their ancestral customs."
 et_culture.110.historical_info: "Clovis I, king of the Salian Franks, was baptized by Bishop Remigius at Reims (traditionally 496 CE, possibly 508). His conversion to Catholic Christianity, unlike the Arianism of other Germanic rulers, fused the Frankish elite with the Gallo-Roman population."
 et_culture.110.tt: "The Frankish and Gallo-Roman population adopts Catholicism."
