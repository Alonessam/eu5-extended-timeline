l_english:
 et_culture.9000.title: "Extended Timeline: Event Template Test"
 et_culture.9000.desc: "This is a template test event for the Extended Timeline culture transition layer (namespace et_culture). If you can read this, the events file loads and the dynamic historical event window fires. It will be replaced by the sourced Egypt pilot chain."
 et_culture.9000.a: "Understood."
 et_culture.9000.historical_info: "Test scaffolding added on 2026-10-17 to verify the WS4 event skeleton; see et-history-data/research/historical-events/README.md."

 et_culture.1.title: "A New Dawn on the Nile"
 et_culture.1.desc: "From Alexandria the new faith has spread upriver for generations: through the ports, the desert monasteries and the villages of the valley. The old temples still stand, but fewer come to their altars each year. How shall the state meet this quiet transformation of Egypt?"
 et_culture.1.historical_info: "Christianity reached Egypt in the 1st century; Alexandria was among the earliest Christian centres. Growth through the 2nd-4th centuries, the persecutions and the Constantinian turn made the Egyptians largely Christian by the 4th-5th century. Source record: egypt_christianization_rise (wiki_christianity_egypt, wiki_coptic_language)."
 et_culture.1.a: "Let the faith spread."
 et_culture.1.a.tt: "Part of the Old Egyptian population in Lower and Upper Egypt converts to Miaphysite Christianity."
 et_culture.1.b: "Keep the old cults favoured."
 et_culture.1.b.tt: "Only a small share converts; the transition stalls here."
 et_culture.2.title: "The Coptic Identity"
 et_culture.2.desc: "The old tongue of the valley now wears Greek letters and a Christian soul: monks and scribes write it, and the Egyptians have begun to call themselves Copts. The Demotic script fades; the old gods fade with it. Will this new identity consolidate?"
 et_culture.2.historical_info: "Coptic is the final stage of the Egyptian language (Old Coptic, 1st century; literary Coptic, 3rd century); the shift came from the same population changing script and faith, not from a replacement. The Council of Chalcedon (451) hardened the boundary between the Coptic (Miaphysite) church and the Greek-speaking Melkites. Source records: egypt_coptic_emergence_and_continuity, egypt_chalcedon_split_451."
 et_culture.2.a: "One people, one name: Copts."
 et_culture.2.a.tt: "The remaining pagan communities largely follow the towns into Christianity, and the Christianized Egyptians adopt the Coptic identity."
 et_culture.2.b: "Keep the old names."
 et_culture.2.b.tt: "Only a small share converts; the identity shift does not happen."
 et_culture.3.title: "The Years of the Dhimma"
 et_culture.3.desc: "New masters rule the Nile: the garrison cities, the tax rolls and the chancery now speak Arabic, and the Protected People pay their jizya. Conversion is slow but real: a better career, a lighter burden, one step out of one community and into another. Who will take that step?"
 et_culture.3.historical_info: "The Rashidun conquest (639-642) changed the rulers and the legal status of the people, not the people themselves: Egypt remained majority-Christian for centuries. Conversion, slow at first, quickened under the fiscal pressure of the 8th-9th centuries. Source record: egypt_islamization_waves (wiki_islamization_egypt); context: egypt_arab_conquest_639_642, egypt_arabic_administration_700."
 et_culture.3.a: "Let the slow tide run its course."
 et_culture.3.a.tt: "Part of the non-Muslim population of Lower and Upper Egypt converts to Islam."
 et_culture.3.b: "Shield the old church."
 et_culture.3.b.tt: "Only a small share converts; the wave stalls here."
 et_culture.4.title: "Ten to One"
 et_culture.4.desc: "Under Fatimid splendour and Mamluk steel the balance has tipped beyond return: for every Christian left in the valley, ten Muslims till the soil and rule the cities. The Coptic cross still rises over the old sanctuaries, but it now stands in another country's land."
 et_culture.4.historical_info: "Conversion accelerated from the Fatimid era and peaked in a large 14th-century Mamluk wave; by the end of the Mamluk period the Muslim-to-Christian ratio stood near ten to one, with Copts concentrated ever more in Upper Egypt. Source record: egypt_islamization_waves (wiki_islamization_egypt)."
 et_culture.4.a: "The valley has changed its faith."
 et_culture.4.a.tt: "A large share of the remaining non-Muslim population converts to Islam."
 et_culture.4.b: "The church endures."
 et_culture.4.b.tt: "Only a small share converts; the wave remains limited."
 et_culture.5.title: "The Quiet Language Shift"
 et_culture.5.desc: "In the towns the old tongue is already gone; in the villages it lingers a few generations more. What is spoken in the markets of Cairo and Asyut is Arabic, and the Muslims of the valley carry names and words that their Christian neighbours keep only in liturgy."
 et_culture.5.historical_info: "Coptic remained the spoken language of the majority until c. 950-1200, declined sharply from al-Hakim's reign and ceased to be literary in the 11th-12th centuries; it survives as a minority and liturgical language. The Coptic population shifts into Lower and Upper Egyptian (Arabic-speaking) identities while a Coptic minority persists. Source record: egypt_coptic_spoken_decline (wiki_coptic_language)."
 et_culture.5.a: "The valley speaks Arabic now."
 et_culture.5.a.tt: "The Muslim population of Lower and Upper Egypt adopts Arabic-speaking Egyptian identities; the Christian minority keeps the Coptic identity."
 et_culture.5.b: "Hold to the old tongue."
 et_culture.5.b.tt: "Only a small part shifts; the old language lingers in the villages."

 et_culture.101.title: "The Gallic Council at Lugdunum"
 et_culture.101.desc: "Under the authority of the imperial peace, chieftains and dignitaries from all the nations of the Three Gauls have assembled before the Altar of Rome and Augustus at Lugdunum. Following the precedent of the deified Claudius, the aristocrats of Gallia Comata seek entry into the Roman Senate and the civic magistracies of the Empire. By adopting the Latin tongue, Roman legal customs, and the toga, the Gallic nobility forms a bridge between indigenous Celtic heritage and Roman civic civilization."
 et_culture.101.a: "Welcome the Gallic nobility into the Roman order."
 et_culture.101.b: "Keep the provincials at arm's length."
 et_culture.101.historical_info: "In 48 CE, Emperor Claudius delivered a landmark speech to the Senate (recorded on the Lyon Bronze Tablet) granting the Gallic aristocracy the right to hold imperial magistracies. The annual Concilium Galliarum at Lugdunum solidified this elite synthesis, giving birth to Gallo-Roman culture."
 et_culture.101.tt: "Gallic nobles and burghers in major provincial civitates adopt the Gallo-Roman culture."

 et_culture.102.title: "Interpretatio Romana in the Gallic Provinces"
 et_culture.102.desc: "Along the paved Roman highways and across the prosperous villa estates of the countryside, the ancient traditions of Gaul have merged with the imperial cult. In temples and shrines from the Seine to the Pyrenees, Lugus is honored beside Mercury, Toutatis alongside Mars, and Epona in the cavalry encampments. Vulgar Latin and Gallo-Roman material culture have become the daily fabric of life for artisans and farmers throughout the provinces."
 et_culture.102.a: "Encourage syncretic worship and provincial integration."
 et_culture.102.b: "Strictly enforce traditional Roman cults."
 et_culture.102.historical_info: "During the 2nd century Pax Romana, religious and linguistic syncretism spread through rural Gaul. Celtic gods were assimilated into the Roman pantheon (Interpretatio Romana), and Gallo-Roman material culture spread to the agrarian peasantry."
 et_culture.102.tt: "Gallic artisans and rural pops adopt the Gallo-Roman culture."

 et_culture.103.title: "The Edict of Caracalla: Universal Citizenship"
 et_culture.103.desc: "By imperial decree of Emperor Caracalla, the Constitutio Antoniniana grants full Roman citizenship to all free men across the provinces of the Empire. The legal distinctions between conqueror and provincial are dissolved. In the cities and villages of Gallia, every free resident is now a full citizen of Rome, bound by the universal majesty of Roman Law."
 et_culture.103.a: "All free Gauls are now citizens of Rome."
 et_culture.103.b: "Restrict citizenship to preserve patrician privilege."
 et_culture.103.historical_info: "Promulgated in 212 CE by Emperor Caracalla (Constitutio Antoniniana, P.Giss. 40), this edict granted Roman citizenship to all free inhabitants of the Roman Empire, completing the legal and cultural unification of the provinces."
 et_culture.103.tt: "Remaining Gallic populations throughout the empire receive Roman citizenship and embrace Gallo-Roman culture."

 et_culture.104.title: "The Gallic Empire"
 et_culture.104.desc: "As the central authority of Rome falters under barbarian invasions and military anarchy, Postumus, a general of Batavian origin, has declared a separate Gallic Empire encompassing Gaul, Britain, and Hispania. The Gallo-Roman elite rally behind him, seeking to preserve Roman civilization on the Rhine frontier. Will Rome acknowledge this breakaway state?"
 et_culture.104.a: "The Gallic provinces must be defended."
 et_culture.104.b: "Rebel governors have no legitimacy."
 et_culture.104.historical_info: "From 260 to 274 CE, Postumus and his successors ruled the Imperium Galliarum, a breakaway state encompassing Gaul, Britain, and Hispania during the Crisis of the Third Century. The empire fell when Aurelian defeated Tetricus at Châlons."
 et_culture.104.tt: "Gallic elites in the breakaway provinces adopt the Gallo-Roman identity."

 et_culture.105.title: "The Martyrs of Lugdunum"
 et_culture.105.desc: "In the amphitheater of Lugdunum, the young slave girl Blandina and the elderly bishop Pothinus are among the first Gauls to die for their Christian faith. Their blood seeds the church of Lyon, and within generations the urban centers of Gaul become strongholds of the new faith. The cities lead; the countryside follows slowly."
 et_culture.105.a: "Honor the martyrs; let the faith spread."
 et_culture.105.b: "The old gods must not be abandoned."
 et_culture.105.historical_info: "The Martyrs of Lugdunum (177 CE), including Blandina and Pothinus, were among the first documented Christian martyrs in Gaul. Their witness led to the establishment of the episcopal see of Lyon and the gradual Christianization of the Gallo-Roman cities."
 et_culture.105.tt: "The urban population of major Gallic cities adopts Chalcedonian Christianity."

 et_culture.106.title: "The Apostle of the Gallic Peasantry"
 et_culture.106.desc: "Martin, a former Roman soldier turned bishop of Tours, travels the countryside destroying sacred groves, pagan springs, and rustic shrines, replacing them with churches and monasteries. The rural Gallic world slowly turns from its ancestral gods to Christ, not by imperial decree but by the zeal of one wandering bishop."
 et_culture.106.a: "Bless Martin's mission among the peasants."
 et_culture.106.b: "The old ways must be preserved."
 et_culture.106.historical_info: "Saint Martin of Tours (316-397) was a former Roman soldier who became bishop of Tours and systematically evangelized the rural Gallic population, destroying pagan temples and establishing churches and monasteries throughout the countryside."
 et_culture.106.tt: "The rural population of the Gallic provinces adopts Chalcedonian Christianity."

 et_culture.107.title: "The Armorican Settlements"
 et_culture.107.desc: "Fleeing the Saxon and Anglo-Saxon invasions of their island, the Brythonic-speaking peoples of Britain cross the sea and settle the western peninsula of Armorica. They bring their language, their saints, and their customs, renaming the land Brittany. The Roman order collapses, but the Celtic spirit endures."
 et_culture.107.a: "Welcome the British refugees to Armorica."
 et_culture.107.b: "The peninsula must remain Gallo-Roman."
 et_culture.107.historical_info: "Between the 4th and 6th centuries, Brythonic-speaking Britons migrated to Armorica fleeing Anglo-Saxon invasions, establishing the region that would become Brittany (Breizh), preserving Celtic language and culture in the northwest of Gaul."
 et_culture.107.tt: "The population of western Armorica adopts the Breton culture."

 et_culture.108.title: "The Rhine Crossing"
 et_culture.108.desc: "On the last night of 406, the frozen Rhine gives way before the mass of Vandals, Alans, and Suebi. The frontier collapses. Burgundians settle the upper Rhine, Visigoths move south toward Aquitaine, and Vandals push toward the Mediterranean. The Roman order in Gaul fractures as Germanic peoples carve out homelands."
 et_culture.108.a: "The frontier has broken; the peoples move."
 et_culture.108.b: "Rome will hold the Rhine."
 et_culture.108.historical_info: "On December 31, 406 CE, Vandals, Alans, and Suebi crossed the frozen Rhine, collapsing the Rhine frontier. Burgundians settled the upper Rhine (413), Visigoths moved to Aquitaine (418), and Vandals pushed south through Gaul toward Hispania."
 et_culture.108.tt: "Burgundian and Visigothic settlers carve out homelands in the Gallic provinces."

 et_culture.109.title: "The Last Roman in Gaul"
 et_culture.109.desc: "Syagrius, son of Aegidius, holds the last Roman domain around Soissons — the 'Kingdom of the Romans' as the Franks call it. When Clovis defeats him at Soissons in 486, Roman Gaul ceases to exist. The Frankish age begins."
 et_culture.109.a: "The Roman order in Gaul has ended."
 et_culture.109.b: "Soissons must not fall."
 et_culture.109.historical_info: "Syagrius ruled the last Roman rump state around Soissons (464-486) until Clovis defeated him at the Battle of Soissons in 486, ending Roman rule in Gaul and establishing Frankish supremacy."
 et_culture.109.tt: "A Frankish elite settles among the Gallo-Roman population of the northern cities."

 et_culture.110.title: "The Baptism of Clovis"
 et_culture.110.desc: "King Clovis, leader of the Salian Franks, kneels at the font of Reims and is baptized by Bishop Remigius. Unlike the Arian Germanic kings, he embraces the Catholic faith of the Gallo-Roman masses. The Frankish and Gallo-Roman peoples fuse into one Christian nation."
 et_culture.110.a: "The Franks and Gallo-Romans become one people."
 et_culture.110.b: "The Franks keep their ancestral customs."
 et_culture.110.historical_info: "Clovis I, king of the Salian Franks, was baptized by Bishop Remigius at Reims (traditionally 496 CE, possibly 508). His conversion to Catholic Christianity, unlike the Arianism of other Germanic rulers, fused the Frankish elite with the Gallo-Roman population."
 et_culture.110.tt: "The Frankish and Gallo-Roman population adopts Catholicism."

 et_culture.111.title: "The Two Tongues of Gaul"
 et_culture.111.desc: "In the north, the Gallo-Roman tongue has shifted under Frankish influence into the language of oïl — the ancestor of modern French. In the south, the Gallo-Roman speech endures as the language of oc, closer to Latin. Along the Alpine frontier, a third tongue — Arpitan — bridges the two. Gaul is no longer one people with one speech."
 et_culture.111.a: "Let the tongues diverge as they will."
 et_culture.111.b: "One Gaul, one language."
 et_culture.111.historical_info: "Between the 7th and 9th centuries, Gallo-Roman speech diverged: the northern langue d'oïl (ancestor of French) under Frankish influence, the southern langue d'oc (Occitan) preserving closer Latin continuity, and Arpitan along the Alpine frontier. The Strasbourg Oaths (842) are the first written document in a Romance vernacular distinct from Latin."
 et_culture.111.tt: "Northern Gaul adopts French, southern Gaul adopts Occitan, and the Alpine frontier adopts Arpitan."

 et_culture.112.title: "The Word in the Vernacular"
 et_culture.112.desc: "The Council of Tours (813) commands the clergy to preach in the rustic Roman tongue — the people's speech — for the masses no longer understand Latin. In 842, the Strasbourg Oaths are sworn in the earliest written French. The church itself has become the midwife of the French language."
 et_culture.112.a: "Let the word be spoken in the people's tongue."
 et_culture.112.b: "Latin is the language of God."
 et_culture.112.historical_info: "The Council of Tours (813) mandated preaching in the vernacular Romance language. The Strasbourg Oaths (842) are the earliest written document in a Romance vernacular distinct from Latin, marking the birth of French as a literary language."
 et_culture.112.tt: "The Gallo-Roman population adopts the French tongue."

 et_culture.113.title: "The Northmen in Normandy"
 et_culture.113.desc: "By the treaty of Saint-Clair-sur-Epte (911), the Viking leader Rollo kneels before King Charles the Simple and receives the lands that will become Normandy. Within two generations, the Northmen speak French, worship Christ, and become the most formidable warriors of the Frankish realm."
 et_culture.113.a: "Grant the Northmen their fief."
 et_culture.113.b: "The sea-wolves cannot be trusted."
 et_culture.113.historical_info: "The Treaty of Saint-Clair-sur-Epte (911) granted Viking leader Rollo the lands that became Normandy. Within two generations, the Normans adopted the French language and Catholic faith while retaining their martial prowess."
 et_culture.113.tt: "Norman settlements appear in Caen, Cherbourg, Bayeux, and Rouen."

 et_culture.114.title: "The Albigensian Crusade"
 et_culture.114.desc: "The Cathar heresy has taken root in the south of France, and the Pope calls for a crusade against it. The armies of the north march on Toulouse and Languedoc. The Occitan culture, so proud and distinct, is broken on the wheel of northern steel and papal authority. The south is annexed to the crown of Paris."
 et_culture.114.a: "The south must bend to Paris."
 et_culture.114.b: "Let the Occitans keep their faith."
 et_culture.114.historical_info: "The Albigensian Crusade (1209-1229) was launched by Pope Innocent III against the Cathar heresy in southern France. The northern French nobility crushed the Occitan resistance, leading to the annexation of Languedoc to the French crown and the decline of Occitan culture."
 et_culture.114.tt: "Northern settlement and royal authority begin to draw the Occitan south toward French culture."

 et_culture.115.title: "The Hundred Years' War"
 et_culture.115.desc: "For over a century the kings of England and France have contested the throne. Yet out of this crucible of war a new thing emerges: a French nation. The peasant girl of Domrémy rallies the armies, and from the Loire to the Rhine, men and women who once called themselves Norman, Breton, or Burgundian now call themselves French. The dialect of Paris becomes the language of the realm."
 et_culture.115.a: "One king, one law, one language."
 et_culture.115.b: "The old provincial identities must endure."
 et_culture.115.historical_info: "The Hundred Years' War (1337-1453) between England and France forged a unified French national identity. Joan of Arc's campaigns (1429) turned the tide, and by the war's end, the French language and identity had supplanted regional particularisms."
 et_culture.115.tt: "The Norman, Arpitan and Frankish populations adopt the French culture and identity."

 et_culture.116.title: "The Edict of Villers-Cotterêts"
 et_culture.116.desc: "King Francis I decrees that all court rulings, court records, and notarial contracts shall be written in French, not Latin. The chancery of the realm turns from the language of the Roman Empire to the language of the French people. Henceforth, justice and the law shall speak the tongue of Paris."
 et_culture.116.a: "French is the language of the realm."
 et_culture.116.b: "Latin is the language of law."
 et_culture.116.historical_info: "The Edict of Villers-Cotterêts (1539), signed by Francis I, mandated the use of French (langue françoise) instead of Latin in judicial acts and notarial records; a landmark in the rise of French as the language of the state."
 et_culture.116.tt: "The Gallo-Roman, Occitan, Arpitan, and Norman populations adopt the French language."

 et_culture.117.title: "The Wars of Religion"
 et_culture.117.desc: "France bleeds. Calvinist Huguenot and Catholic armies tear the kingdom apart in an endless cycle of massacre and reprisal — St. Bartholomew's Day, the Wars of Religion. At last Henry IV issues the Edict of Nantes granting toleration, and after his assassination, Louis XIV tears it up. The Protestants flee; the kingdom is one faith again."
 et_culture.117.a: "One king, one law, one faith."
 et_culture.117.b: "Let the Huguenots keep their faith."
 et_culture.117.historical_info: "The French Wars of Religion (1562-1598) between Catholics and Huguenots (Calvinists) devastated France. The Edict of Nantes (1598) granted toleration, but Louis XIV's Edict of Fontainebleau (1685) revoked it, leading to mass Protestant emigration."
 et_culture.117.tt: "The Calvinist population adopts Catholicism."

 et_culture.118.title: "The One and Indivisible Republic"
 et_culture.118.desc: "The Revolution proclaims a nation that is one and indivisible. Abbé Grégoire presents his report on the need to destroy the regional dialects — Breton, Occitan, Basque, Alsatian — which are condemned as feudal relics. French alone shall be spoken in the schools of the Republic. The last provincial identities are melted into the universal citizen."
 et_culture.118.a: "One nation, one language: French."
 et_culture.118.b: "The provinces must keep their tongues."
 et_culture.118.historical_info: "The French Revolution (1789-1799) pursued linguistic unification. Abbé Henri Grégoire's 1794 report 'On the necessity and means of annihilating the patois and universalizing the French language' called for the suppression of regional languages. Universal education spread standard French at the expense of local identities."
 et_culture.118.tt: "The Republican school presses much of the Occitan, Arpitan, Norman and Frankish population toward French culture."

 et_culture.119.title: "The School of the Republic"
 et_culture.119.desc: "Every village of France shall have its school. By the laws of Jules Ferry, primary education is made free in 1881, then mandatory and laic in 1882: the Republican school takes the children of the countryside from the parish and the patois and gives them the language, the history and the nation. In Brittany the schoolhouse multiplies; in the classroom, French alone is heard. The last tongues of Old Gaul are to be melted into a single people."
 et_culture.119.a: "Education shall make one nation of France."
 et_culture.119.b: "The parish and the patois are enough."
 et_culture.119.historical_info: "The Jules Ferry laws (1881-1882) established free, mandatory and secular primary education. Article 1 of the 1882 law made the French language and literature a core subject; provision expanded fastest in the least francophone regions, and the Republican school became the chief engine of linguistic unification. Source record: gaul_jules_ferry_modern_unification_1881 (weber_peasants_into_frenchmen; wiki_jules_ferry_laws)."
 et_culture.119.tt: "Half of the remaining Breton-speaking population adopts the French culture as the Republican school spreads."

 et_culture.120.title: "The Separation"
 et_culture.120.desc: "After a century of struggle between the altar and the Republic, the Chamber passes the law of 9 December 1905: the state no longer recognises, funds or guards any religion. Church property becomes public, the crucifix is taken from the courtroom and the school, and laïcité becomes a founding principle of the Republic. Rome thunders against the 'nefarious law', and France is divided again - but the secular state is here to stay."
 et_culture.120.a: "The Republic is secular: laïcité."
 et_culture.120.b: "Concord with the Church."
 et_culture.120.historical_info: "The 1905 law on the Separation of the Churches and the State ended state funding and recognition of religion and established laïcité; it did not apply in German-ruled Alsace-Moselle. Pope Pius X condemned it in the 1906-1907 encyclicals, and reconciliation came only in the 1920s. Source record: gaul_laicite_separation_1905 (wiki_separation_church_state_1905)."

 et_culture.121.title: "The Sacred Union"
 et_culture.121.desc: "In August 1914 the call goes out: all Frenchmen, of every party and every province, are summoned to the defence of the patrie. The trenches of the Great War grind together men from Paris and Brittany, from Provence and Flanders; they bleed, and they learn to speak to one another. When the survivors return, they are no longer Bretons or Provencaux but Frenchmen."
 et_culture.121.a: "A sacred union of all Frenchmen."
 et_culture.121.b: "This war is not ours."
 et_culture.121.historical_info: "On 4 August 1914 President Poincaré proclaimed the union sacrée, and the left suspended its opposition for the duration of the war. The mass conscript army brought together men of every region, completing the linguistic and national integration begun by the Republican school. Source record: gaul_great_war_union_sacree_1914_1918 (wiki_sacred_union; weber_peasants_into_frenchmen)."
 et_culture.121.tt: "The remaining Breton population adopts the French culture as the nation is forged in the trenches."

 et_culture.122.title: "The Trente Glorieuses"
 et_culture.122.desc: "In the ruins of the war France needs labour, and needs it fast. The state opens the doors: Portuguese peasants flee Salazar across the Pyrenees, Algerians come by the hundred thousand before and after independence, Italians and Spaniards cross the Alps and the Pyrenees, and Moroccans, Tunisians, Berbers and Turks follow in their wake. They raise the towers of the banlieue, hew the coal, pour the steel and lay the roads of the Trente Glorieuses. By 1975 these newcomers fill the workshops and mines of France, and the Republic must decide whether it will keep them."
 et_culture.122.a: "Recruit the workers of Europe and the Maghreb."
 et_culture.122.b: "Close the gates: France for the French."
 et_culture.122.historical_info: "Postwar reconstruction and the Trente Glorieuses (1945-1975) drew millions of foreign workers to France, recruited through the National Immigration Office. Algerians moved freely until independence in 1962, after which their community grew from about 350,000 to 700,000; Portuguese emigration peaked at 135,667 arrivals in 1970; Moroccans, Tunisians and Turks followed in the 1960s. About two-thirds of these immigrants worked in mining, steel, construction and the automotive industry. Source record: gaul_postwar_labour_immigration_1945_1975 (wiki_immigration_to_france; wiki_portuguese_in_france)."
 et_culture.122.tt: "Portuguese, Algerian, Moroccan, Berber, Turkish, Italian and Spanish labourers settle in the industrial cities of France."

 et_culture.123.title: "The Language of the Republic"
 et_culture.123.desc: "The Fifth Republic writes into its constitution that the language of the Republic is French. When the government prepares to ratify the European Charter for Regional or Minority Languages, the Constitutional Council refuses: the indivisible Republic knows one tongue. In 2008 the constitution concedes only that the regional languages belong to the patrimony of France. Breton, Occitan and Alsatian survive as voices of memory, not of the marketplace."
 et_culture.123.a: "One Republic, one language."
 et_culture.123.b: "The old tongues are part of France's patrimony."
 et_culture.123.historical_info: "Article 2 of the constitution (1992) enshrines French as the language of the Republic; the 1999 Cerquiglini report led to a Charter ratification blocked by the Constitutional Council, and a 2008 revision recognised regional languages only as patrimony (art. 75-1). Source record: gaul_language_of_the_republic_1992_2008 (wiki_languages_of_france)."
 et_culture.6.title: "The Silence of Meroë"
 et_culture.6.desc: "The Kushite kingdom that once ruled the Middle Nile is fading. Aksumite armies have broken Meroë, the Meroitic script is falling silent, and Nobadian successors settle along the riverbanks. The old elite can cling to Kushite identity, or the court can accept that the future of the Nile is Nubian."
 et_culture.6.historical_info: "Kushite Meroë declined through the 3rd-4th centuries; Aksum destroyed the city around 350 and Meroitic disappeared around 400, while Nobadian successors emerged on the lower Nile. The event models the cultural shift only; it does not destroy the Kushite state. Source record: kush_meroe_collapse_and_nubian_successors (wiki_meroe; wiki_nobatia)."
 et_culture.6.a: "Let the old kingdom fade."
 et_culture.6.a.tt: "60% of the Kushite population in Butana and Nubia becomes Nubian."
 et_culture.6.b: "Preserve the Kushite names."
 et_culture.6.b.tt: "20% of the Kushite population in Butana and Nubia becomes Nubian."
 et_culture.7.title: "The Baptism of Nobatia"
 et_culture.7.desc: "Nobatian envoys return from Constantinople with priests and a royal baptism. The towns take the new faith quickly; the villages follow slowly along the river. The court must decide how far to carry the cross into Nubia."
 et_culture.7.historical_info: "Nobatia's court converted to non-Chalcedonian Christianity in 543; towns converted quickly and villages during the 7th-9th centuries, and Makuria absorbed Nobatia by 707. The event models the population conversion; the royal/state layer is not scripted in v1. Source record: nubia_christianization_543 (wiki_nobatia)."
 et_culture.7.a: "Baptize the kingdom."
 et_culture.7.a.tt: "60% of the Nubian population in Nubia proper and 35% in Butana converts to Miaphysite Christianity."
 et_culture.7.b: "Keep the old temples."
 et_culture.7.b.tt: "20% of the Nubian population in Nubia proper and 10% in Butana converts to Miaphysite Christianity."
 et_culture.8.title: "The Emperor's Wrath in Alexandria"
 et_culture.8.desc: "Caracalla winters in Alexandria on his road to the East. The city receives him with festivals and honours, but its famous wit has turned against the emperor himself: satirical verses on the death of Geta play in the theatre and circulate in the streets. The court has noted the laughter, and Caracalla is not a man to forgive."
 et_culture.8.historical_info: "In the winter of 215/216 Caracalla visited Alexandria on his way east. Provoked by the citizens' mockery of his account of his brother Geta's death, he had the delegation of leading men massacred on their arrival and let the troops plunder the city for days; he had earlier advertised his devotion to Serapis. Source record: egypt_caracalla_alexandria_215 (wiki_caracalla)."
 et_culture.8.a: "Let Alexandria learn the cost of mockery."
 et_culture.8.b: "Ignore the songs and continue east."
 et_culture.9.title: "The Persians Take Egypt"
 et_culture.9.desc: "After a long siege the army of the King of Kings has entered Alexandria, and the grain of Egypt now flows east under Persian officials. The province passes under the administration of Shahrbaraz; the Coptic Church, long estranged from Constantinople, watches the new masters and waits."
 et_culture.9.historical_info: "Sasanian forces conquered Egypt in 618-621; Alexandria fell in June 619 and the province was governed for about ten years by Shahrbaraz's administration. The occupation was evacuated in the summer of 629 and Heraclius restored Byzantine rule. Source record: egypt_sasanian_occupation_618_629 (wiki_sasanian_conquest_egypt)."
 et_culture.9.a: "Govern Egypt as a Persian province."
 et_culture.9.b: "Hold Egypt lightly, as a pledge for peace."
 et_culture.10.title: "Amr's Covenant: Egypt Passes to the Arabs"
 et_culture.10.desc: "Amr ibn al-As has crossed into Egypt with a small army. Babylon is under siege and the Roman garrisons fall back on Alexandria; in the camp beside the fortress a new settlement already rises. The envoys speak of covenant and tribute, not of fire: those who submit will keep their churches and pay the jizya. Egypt stands at the threshold of a new age."
 et_culture.10.historical_info: "Amr ibn al-As crossed into Egypt in December 639; Babylon fell in April 641 and Alexandria was surrendered by treaty in 642. The army settled at Fustat beside Babylon, which became the seat of government; the dhimma left the churches to the Christians against the jizya, and the exiled patriarch Benjamin I returned in 644. Source records: egypt_arab_conquest_and_fustat_641 (wiki_arab_conquest_egypt; wiki_fustat)."
 et_culture.10.a: "Seal the covenant: churches, tribute and the camp at Fustat."
 et_culture.10.b: "Let the army take what the treaty would have spared."
 et_culture.11.title: "The Diwan Speaks Arabic"
 et_culture.11.desc: "The tax registers of Egypt are still kept in Greek, as in the days of the Romans, and the Coptic scribes guard their ancient craft. The caliph's half-brother Abd Allah ibn Abd al-Malik has come to Fustat with an order from Damascus: the diwan shall be written in Arabic, and the language of the Quran shall follow the state into every office."
 et_culture.11.historical_info: "In 705/706, under al-Walid I, governor Abd Allah ibn Abd al-Malik ordered the Egyptian diwan to be kept in Arabic instead of Greek and Coptic, completing the chancery arabization begun by Abd al-Malik around 700; Coptic's public role narrowed to the church thereafter. Source records: egypt_arabic_chancery_reform_706 (wiki_al_walid_i; wiki_coptic_language)."
 et_culture.11.a: "Arabic in every register of the province."
 et_culture.11.b: "Keep the Greek and Coptic scribes in office."
 et_culture.12.title: "The Bashmurite Uprising"
 et_culture.12.desc: "The villages of the northern marshes have risen against the tax. Their men slip between the reed islands in small boats, refuse the collectors and drive the caliph's officials from the delta; the towns pay tribute to both sides. The revolt has outlasted more than one governor, and now an army comes down from the east to end it."
 et_culture.12.historical_info: "The Bashmurites, the Copts of the northern Delta marshes, rose against taxation repeatedly from c. 720 to 832; the final revolt was crushed in 831-832 by al-Ma'mun's forces under al-Afshin, who burned the marshes and scattered the communities. Source record: egypt_bashmurite_revolts_831_832 (wiki_bashmurian_revolts)."
 et_culture.12.a: "Burn the marshes and break the revolt."
 et_culture.12.b: "Lower the tax and hear their grievance."
 et_culture.13.title: "The House of Tulun"
 et_culture.13.desc: "Ahmad ibn Tulun, the caliph's deputy in Egypt, has made the province his own. He pays a loyal army from Egyptian revenues, builds the new quarter of al-Qata'i outside Fustat and has carried his rule into Syria; Baghdad's demands are met with courtesy and delays. Egypt is becoming a kingdom in all but name."
 et_culture.13.historical_info: "Ahmad ibn Tulun came to Egypt as the caliph's deputy in 868, paid a personally loyal army from the province's revenues, laid out al-Qata'i in 870 and annexed Syria in 878; his successors ruled Egypt under formal Abbasid suzerainty until the Abbasid reconquest of 905. Source record: egypt_tulunid_autonomy_868_905 (wiki_tulunid_dynasty)."
 et_culture.13.a: "Keep Egypt's revenues in Egypt."
 et_culture.13.b: "Remit the surplus and rule as the caliph's servant."
 et_culture.14.title: "The Ikhshidid Settlement"
 et_culture.14.desc: "Muhammad ibn Tughj has entered Fustat and taken the province in hand: he has driven back the Fatimid raiders from the western desert and broken the factions that tore at the city. The caliph has recognised him with the old princely title of al-Ikhshid. Egypt has a master again, and Baghdad is far away."
 et_culture.14.historical_info: "Muhammad ibn Tughj entered Fustat in August 935, repelled a Fatimid incursion near Alexandria in 936 and received the title al-Ikhshid in 939; his house, with the eunuch Kafur, governed Egypt until the Fatimid conquest of 969. Source record: egypt_ikhshidid_rule_935_969 (wiki_ikhshidid_dynasty)."
 et_culture.14.a: "Accept the title and the substance with it."
 et_culture.14.b: "Govern in the caliph's name and send the surplus on."
 et_culture.15.title: "The Fatimid Conquest of Egypt"
 et_culture.15.desc: "The Fatimid army has marched from Ifriqiya and entered Fustat. Jawhar al-Siqilli grants the city his aman, and north of the old camp a new palace-city rises: al-Qahira, the Victorious, where the imam-caliph will take his seat. In 973 al-Muizz leaves Mahdia for the Nile, and the centre of the Fatimid world moves with him."
 et_culture.15.historical_info: "Jawhar al-Siqilli set out from Ifriqiya in February 969 and entered Fustat in July under an aman; al-Qahira was founded in 969-971 (al-Azhar begun in 970), and in 973 imam-caliph al-Muizz moved the court from Mahdia to Cairo. Source records: egypt_fatimid_conquest_and_cairo_969_973 (wiki_fatimid_conquest_egypt; wiki_fustat)."
 et_culture.15.a: "Found the new capital; the imam-caliph comes to Egypt."
 et_culture.15.b: "Rule Egypt from the old camp as a far province."
 et_culture.16.title: "The Last Byzantine Summer"
 et_culture.16.desc: "A Roman fleet has appeared off Alexandria and the city has opened its gates to the empire: Manuel, an officer of Constans II, holds the great harbour with Byzantine troops. But the caliph has restored Amr ibn al-As, and Arab columns are already moving north. For a season the empire and the caliphate stand face to face over the Nile."
 et_culture.16.historical_info: "In 645 a Byzantine force under Manuel recovered Alexandria and parts of the Delta; caliph Uthman reinstated Amr ibn al-As, the Byzantines were defeated at Nikiou in 646, Alexandria was stormed and Manuel was killed. It was the last serious Byzantine attempt to retake Egypt for some five hundred years. Source record: egypt_byzantine_counterattack_645_646 (wiki_arab_conquest_egypt)."
 et_culture.16.a: "Hold Alexandria; the empire reclaims the province."
 et_culture.16.b: "Withdraw before the Arab army returns."
